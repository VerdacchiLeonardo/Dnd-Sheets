<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#080810">
  <title>D&D Sheets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cinzel+Decorative:wght@400;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
/* =============================================
   D&D CHARACTER SHEETS — Global Styles
   Dark medieval-fantasy, responsive
   ============================================= */

@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cinzel+Decorative:wght@400;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap');

/* ---- Reset & Base ---- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:          #080810;
  --bg2:         #0d0d1a;
  --bg3:         #111122;
  --surface:     #12121f;
  --surface2:    #1a1a2e;
  --border:      #2a2a4a;
  --border2:     #3a3a5a;
  --gold:        #c9a84c;
  --gold2:       #e8c96a;
  --gold-dim:    #7a6020;
  --red:         #8b1a1a;
  --red2:        #c42b2b;
  --blue:        #1a3a6b;
  --blue2:       #2a5aaa;
  --purple:      #3a1a5a;
  --purple2:     #6a2a9a;
  --text:        #e8dcc8;
  --text2:       #c0b090;
  --text-dim:    #7a6a50;
  --white:       #f5f0e8;
  --glow:        rgba(201,168,76,0.15);
  --glow2:       rgba(201,168,76,0.3);
  --font-h:      'Cinzel', serif;
  --font-deco:   'Cinzel Decorative', serif;
  --font-b:      'EB Garamond', serif;
  --r:           8px;
  --r2:          16px;
  --shadow:      0 4px 20px rgba(0,0,0,0.8);
  --shadow2:     0 8px 40px rgba(0,0,0,0.9);
}

html { font-size: 16px; scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-b);
  font-size: 1rem;
  line-height: 1.6;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ---- Scrollbar ---- */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--gold); }

/* =============================================
   PARTICLES BACKGROUND
   ============================================= */
#particles-canvas {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  opacity: 0.5;
}

/* =============================================
   TYPOGRAPHY
   ============================================= */
h1, h2, h3, h4 { font-family: var(--font-h); letter-spacing: 0.08em; }
h1 { font-size: clamp(2rem, 6vw, 4rem); font-family: var(--font-deco); }
h2 { font-size: clamp(1.4rem, 4vw, 2.2rem); }
h3 { font-size: clamp(1.1rem, 3vw, 1.6rem); }
h4 { font-size: 1.1rem; }

.title-glow {
  color: var(--gold);
  text-shadow: 0 0 10px var(--gold), 0 0 30px rgba(201,168,76,0.4), 0 0 60px rgba(201,168,76,0.15);
  animation: textPulse 3s ease-in-out infinite;
}

.subtitle {
  font-family: var(--font-h);
  font-size: clamp(0.8rem, 2vw, 1rem);
  letter-spacing: 0.3em;
  color: var(--text-dim);
  text-transform: uppercase;
}

a { color: var(--gold); text-decoration: none; transition: color 0.2s; }
a:hover { color: var(--gold2); }

/* =============================================
   LAYOUT
   ============================================= */
.page-wrap {
  position: relative;
  z-index: 1;
  min-height: 100vh;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 clamp(1rem, 4vw, 2rem);
}

.center { text-align: center; }

/* =============================================
   NAVBAR
   ============================================= */
.navbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.8rem clamp(1rem, 4vw, 2rem);
  background: rgba(8,8,16,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}

.navbar-brand {
  font-family: var(--font-deco);
  font-size: 1.1rem;
  color: var(--gold);
  text-shadow: 0 0 8px rgba(201,168,76,0.5);
}

.navbar-user {
  display: flex;
  align-items: center;
  gap: 0.8rem;
}

.navbar-username {
  font-family: var(--font-h);
  font-size: 0.85rem;
  color: var(--text2);
  letter-spacing: 0.1em;
}

.btn-logout {
  font-size: 0.75rem;
  padding: 0.3rem 0.8rem;
  background: transparent;
  border: 1px solid var(--border2);
  color: var(--text-dim);
  cursor: pointer;
  border-radius: var(--r);
  font-family: var(--font-h);
  transition: all 0.2s;
}
.btn-logout:hover { border-color: var(--red2); color: var(--red2); }

/* =============================================
   BUTTONS
   ============================================= */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  padding: 0.75rem 1.8rem;
  font-family: var(--font-h);
  font-size: 0.9rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  cursor: pointer;
  border-radius: var(--r);
  border: none;
  transition: all 0.25s;
  position: relative;
  overflow: hidden;
  white-space: nowrap;
}

.btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.05), transparent);
  opacity: 0;
  transition: opacity 0.25s;
}
.btn:hover::before { opacity: 1; }

.btn-primary {
  background: linear-gradient(135deg, var(--gold-dim), var(--gold));
  color: #1a1000;
  box-shadow: 0 0 20px rgba(201,168,76,0.2);
}
.btn-primary:hover {
  background: linear-gradient(135deg, var(--gold), var(--gold2));
  box-shadow: 0 0 30px rgba(201,168,76,0.4), 0 0 60px rgba(201,168,76,0.15);
  transform: translateY(-1px);
}

.btn-secondary {
  background: transparent;
  color: var(--gold);
  border: 1px solid var(--gold-dim);
}
.btn-secondary:hover {
  border-color: var(--gold);
  box-shadow: 0 0 15px rgba(201,168,76,0.2);
  background: rgba(201,168,76,0.05);
}

.btn-danger {
  background: transparent;
  color: var(--red2);
  border: 1px solid var(--red);
}
.btn-danger:hover { background: rgba(139,26,26,0.2); border-color: var(--red2); }

.btn-sm { padding: 0.4rem 1rem; font-size: 0.78rem; }
.btn-lg { padding: 1rem 2.5rem; font-size: 1rem; }

.btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* =============================================
   CARDS
   ============================================= */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r2);
  padding: 1.5rem;
  position: relative;
  transition: all 0.3s;
}

.card::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: var(--r2);
  background: linear-gradient(135deg, rgba(201,168,76,0.03), transparent 60%);
  pointer-events: none;
}

.card:hover {
  border-color: var(--border2);
  box-shadow: var(--shadow);
  transform: translateY(-2px);
}

.card-gold {
  border-color: var(--gold-dim);
  box-shadow: 0 0 20px rgba(201,168,76,0.08);
}

/* =============================================
   FORMS
   ============================================= */
.form-group {
  margin-bottom: 1.2rem;
}

label {
  display: block;
  font-family: var(--font-h);
  font-size: 0.78rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--text2);
  margin-bottom: 0.4rem;
}

input[type="text"],
input[type="number"],
input[type="email"],
textarea,
select {
  width: 100%;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  color: var(--text);
  font-family: var(--font-b);
  font-size: 1rem;
  padding: 0.6rem 0.9rem;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  -webkit-appearance: none;
}

input:focus, textarea:focus, select:focus {
  border-color: var(--gold-dim);
  box-shadow: 0 0 0 2px rgba(201,168,76,0.1);
}

select option { background: var(--bg2); }

textarea {
  resize: vertical;
  min-height: 80px;
}

input[type="number"] { -moz-appearance: textfield; }
input[type="number"]::-webkit-inner-spin-button { display: none; }

/* Ability score input (compact) */
.ability-input {
  width: 60px !important;
  text-align: center;
  font-size: 1.2rem;
  font-family: var(--font-h);
}

/* Autocomplete */
.autocomplete-wrap { position: relative; }
.autocomplete-list {
  position: absolute;
  top: 100%;
  left: 0; right: 0;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-top: none;
  border-radius: 0 0 var(--r) var(--r);
  max-height: 200px;
  overflow-y: auto;
  z-index: 200;
  display: none;
}
.autocomplete-list.open { display: block; }
.autocomplete-item {
  padding: 0.5rem 0.9rem;
  cursor: pointer;
  font-size: 0.9rem;
  transition: background 0.15s;
  border-bottom: 1px solid var(--border);
}
.autocomplete-item:hover, .autocomplete-item.active {
  background: rgba(201,168,76,0.1);
  color: var(--gold);
}
.autocomplete-item small {
  display: block;
  font-size: 0.75rem;
  color: var(--text-dim);
  margin-top: 2px;
}

/* =============================================
   LANDING PAGE
   ============================================= */
.landing {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem clamp(1rem, 4vw, 2rem);
  text-align: center;
  position: relative;
}

.landing-logo {
  margin-bottom: 1rem;
  animation: floatY 4s ease-in-out infinite;
}

.landing-logo svg {
  width: clamp(60px, 12vw, 100px);
  height: auto;
  filter: drop-shadow(0 0 15px rgba(201,168,76,0.5));
}

.landing-title { margin-bottom: 0.5rem; }
.landing-subtitle { margin-bottom: 3rem; }

.landing-divider {
  width: 200px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
  margin: 1.5rem auto;
}

/* Login card */
.login-card {
  width: 100%;
  max-width: 420px;
  margin: 0 auto;
}

.login-card h2 {
  font-size: 1.3rem;
  color: var(--gold);
  margin-bottom: 1.5rem;
}

.login-options {
  display: flex;
  flex-direction: column;
  gap: 0.8rem;
  margin-top: 1rem;
}

.user-chip {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.6rem 1rem;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 50px;
  cursor: pointer;
  transition: all 0.2s;
  font-family: var(--font-h);
  font-size: 0.85rem;
  color: var(--text2);
}
.user-chip:hover { border-color: var(--gold-dim); color: var(--gold); }
.user-chip-icon { font-size: 1rem; }

/* =============================================
   COMPASS UI — Character Creation
   ============================================= */
.creation-page {
  padding-top: 80px;
  min-height: 100vh;
}

.compass-container {
  position: relative;
  width: min(580px, 95vw);
  height: min(580px, 95vw);
  margin: 0 auto;
}

.compass-ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 1px solid var(--border);
  animation: compassSpin 60s linear infinite;
  pointer-events: none;
}

.compass-ring-outer {
  border-color: var(--gold-dim);
  opacity: 0.3;
  animation-duration: 80s;
}

.compass-ring-inner {
  inset: 30px;
  border-color: var(--border2);
  opacity: 0.2;
  animation-direction: reverse;
  animation-duration: 40s;
}

.compass-center {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: min(160px, 30vw);
  height: min(160px, 30vw);
  border-radius: 50%;
  background: radial-gradient(circle at 40% 40%, var(--surface2), var(--bg));
  border: 2px solid var(--gold-dim);
  box-shadow: 0 0 30px rgba(201,168,76,0.1), inset 0 0 30px rgba(0,0,0,0.5);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 1rem;
  z-index: 10;
}

.compass-center-name {
  font-family: var(--font-h);
  font-size: clamp(0.7rem, 2vw, 0.95rem);
  color: var(--gold);
  line-height: 1.2;
  max-width: 120px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.compass-center-info {
  font-size: clamp(0.6rem, 1.5vw, 0.78rem);
  color: var(--text-dim);
  margin-top: 0.2rem;
}

.compass-center-step {
  font-size: 0.65rem;
  color: var(--text-dim);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-top: 0.4rem;
}

/* Compass Section Nodes */
.compass-section {
  position: absolute;
  width: min(80px, 15vw);
  height: min(80px, 15vw);
  border-radius: 50%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  background: radial-gradient(circle at 35% 35%, var(--surface2), var(--bg2));
  border: 1px solid var(--border2);
  z-index: 5;
  user-select: none;
}

.compass-section::before {
  content: '';
  position: absolute;
  inset: -4px;
  border-radius: 50%;
  border: 1px solid transparent;
  transition: all 0.3s;
}

.compass-section.active::before {
  border-color: var(--gold);
  box-shadow: 0 0 15px var(--gold), 0 0 30px rgba(201,168,76,0.3);
  animation: pulse 2s ease-in-out infinite;
}

.compass-section.completed::before {
  border-color: rgba(201,168,76,0.5);
}

.compass-section:hover {
  transform: scale(1.12);
  border-color: var(--gold-dim);
  box-shadow: 0 0 20px rgba(201,168,76,0.2);
  z-index: 15;
}

.compass-section:hover::before {
  border-color: var(--gold-dim);
}

.compass-section-icon {
  font-size: clamp(1.2rem, 3vw, 1.8rem);
  line-height: 1;
}

.compass-section-label {
  font-family: var(--font-h);
  font-size: clamp(0.45rem, 1.2vw, 0.62rem);
  letter-spacing: 0.05em;
  color: var(--text2);
  text-align: center;
  margin-top: 2px;
  max-width: 70px;
}

.compass-section.active .compass-section-label { color: var(--gold); }
.compass-section.completed .compass-section-icon::after {
  content: '✓';
  position: absolute;
  top: 2px; right: 2px;
  font-size: 0.5rem;
  color: var(--gold);
  background: var(--bg);
  border-radius: 50%;
  width: 12px; height: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Connector lines between center and sections */
.compass-line {
  position: absolute;
  top: 50%; left: 50%;
  height: 1px;
  background: linear-gradient(90deg, var(--gold-dim), transparent);
  transform-origin: 0 50%;
  opacity: 0.2;
  pointer-events: none;
  z-index: 1;
}

/* =============================================
   SECTION PANEL (modal-style drawer)
   ============================================= */
.section-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  z-index: 50;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}
.section-overlay.open { opacity: 1; pointer-events: all; }

.section-panel {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: min(600px, 100vw);
  background: var(--surface);
  border-left: 1px solid var(--border);
  z-index: 51;
  transform: translateX(100%);
  transition: transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.section-panel.open { transform: translateX(0); }

.section-panel-header {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 1.2rem 1.5rem;
  border-bottom: 1px solid var(--border);
  background: var(--surface2);
  flex-shrink: 0;
}

.section-panel-icon { font-size: 1.8rem; }

.section-panel-title {
  font-family: var(--font-h);
  font-size: 1.2rem;
  color: var(--gold);
  flex: 1;
}

.section-panel-close {
  background: none;
  border: 1px solid var(--border2);
  color: var(--text-dim);
  cursor: pointer;
  width: 32px; height: 32px;
  border-radius: 50%;
  font-size: 1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}
.section-panel-close:hover { border-color: var(--red2); color: var(--red2); }

.section-panel-body {
  flex: 1;
  overflow-y: auto;
  padding: 1.5rem;
}

.section-panel-footer {
  padding: 1rem 1.5rem;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 0.8rem;
  justify-content: flex-end;
  flex-shrink: 0;
}

/* =============================================
   ABILITY SCORES
   ============================================= */
.ability-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1rem;
}

.ability-box {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r2);
  padding: 1rem;
  text-align: center;
  transition: all 0.2s;
  position: relative;
}

.ability-box:hover { border-color: var(--gold-dim); }

.ability-box-name {
  font-family: var(--font-h);
  font-size: 0.7rem;
  letter-spacing: 0.15em;
  color: var(--text2);
  text-transform: uppercase;
}

.ability-box-score {
  font-family: var(--font-h);
  font-size: 2.2rem;
  color: var(--white);
  line-height: 1;
  margin: 0.3rem 0;
}

.ability-box-modifier {
  font-family: var(--font-h);
  font-size: 1rem;
  color: var(--gold);
  background: var(--bg);
  width: 40px; height: 40px;
  border-radius: 50%;
  border: 1px solid var(--border2);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto;
}

.ability-box-racial {
  font-size: 0.65rem;
  color: var(--text-dim);
  position: absolute;
  top: 4px; right: 6px;
}

/* Point buy controls */
.point-buy-total {
  text-align: center;
  padding: 0.8rem;
  background: var(--bg2);
  border-radius: var(--r);
  margin-bottom: 1rem;
  font-family: var(--font-h);
}

.point-buy-total span {
  font-size: 1.4rem;
  color: var(--gold);
}

.score-control {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  margin: 0.4rem 0;
}

.score-btn {
  width: 24px; height: 24px;
  border-radius: 50%;
  background: var(--surface2);
  border: 1px solid var(--border2);
  color: var(--text);
  cursor: pointer;
  font-size: 0.9rem;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}
.score-btn:hover { background: var(--gold-dim); }
.score-btn:disabled { opacity: 0.3; cursor: not-allowed; }

/* =============================================
   SKILLS PANEL
   ============================================= */
.skills-list {
  display: grid;
  grid-template-columns: 1fr;
  gap: 0.4rem;
}

.skill-row {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.4rem 0.6rem;
  border-radius: var(--r);
  transition: background 0.15s;
  cursor: pointer;
}

.skill-row:hover { background: rgba(201,168,76,0.05); }

.skill-check {
  width: 18px; height: 18px;
  border-radius: 50%;
  border: 1px solid var(--border2);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s;
  cursor: pointer;
  font-size: 0.6rem;
  color: transparent;
}

.skill-row.proficient .skill-check {
  background: var(--gold-dim);
  border-color: var(--gold);
  color: var(--bg);
}
.skill-row.expertise .skill-check {
  background: var(--gold);
  border-color: var(--gold2);
  color: var(--bg);
}

.skill-name {
  flex: 1;
  font-size: 0.9rem;
}

.skill-ability {
  font-family: var(--font-h);
  font-size: 0.65rem;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  width: 30px;
}

.skill-bonus {
  font-family: var(--font-h);
  font-size: 0.9rem;
  color: var(--gold);
  width: 30px;
  text-align: right;
}

/* =============================================
   COMBAT PANEL
   ============================================= */
.combat-stats-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.8rem;
  margin-bottom: 1.5rem;
}

.stat-box {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 0.8rem;
  text-align: center;
}

.stat-box-value {
  font-family: var(--font-h);
  font-size: 1.6rem;
  color: var(--white);
}

.stat-box-label {
  font-family: var(--font-h);
  font-size: 0.6rem;
  color: var(--text-dim);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  display: block;
  margin-top: 2px;
}

.hp-tracker {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 0.8rem 1rem;
  margin-bottom: 1rem;
}

.hp-label {
  font-family: var(--font-h);
  font-size: 0.7rem;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  min-width: 60px;
}

.hp-current {
  font-family: var(--font-h);
  font-size: 1.4rem;
  color: var(--red2);
}

.hp-max { font-family: var(--font-h); color: var(--text2); }
.hp-bar-wrap { flex: 1; height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; }
.hp-bar { height: 100%; background: linear-gradient(90deg, var(--red), var(--red2)); border-radius: 3px; transition: width 0.5s; }

/* Attacks table */
.attacks-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.85rem;
}
.attacks-table th {
  font-family: var(--font-h);
  font-size: 0.65rem;
  letter-spacing: 0.1em;
  color: var(--text-dim);
  text-transform: uppercase;
  padding: 0.4rem 0.6rem;
  text-align: left;
  border-bottom: 1px solid var(--border);
}
.attacks-table td {
  padding: 0.4rem 0.6rem;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.attacks-table tr:hover td { background: rgba(201,168,76,0.04); }

/* =============================================
   EQUIPMENT PANEL
   ============================================= */
.currency-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 0.6rem;
  margin-bottom: 1.5rem;
}

.currency-item {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 0.6rem;
  text-align: center;
}

.currency-symbol {
  font-size: 0.7rem;
  color: var(--text-dim);
  display: block;
  font-family: var(--font-h);
}

.currency-input {
  width: 100%;
  text-align: center;
  font-size: 1rem;
  font-family: var(--font-h);
  color: var(--gold);
  background: transparent;
  border: none;
  outline: none;
  padding: 0;
}

.eq-item-row {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.4rem 0.6rem;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  font-size: 0.9rem;
  transition: background 0.15s;
}
.eq-item-row:hover { background: rgba(201,168,76,0.04); }
.eq-item-name { flex: 1; }
.eq-item-qty {
  width: 36px;
  text-align: center;
  font-family: var(--font-h);
  color: var(--text2);
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 2px;
}
.eq-item-delete {
  cursor: pointer;
  color: var(--text-dim);
  background: none;
  border: none;
  font-size: 0.85rem;
  padding: 2px 6px;
  transition: color 0.2s;
}
.eq-item-delete:hover { color: var(--red2); }

/* =============================================
   SPELLS PANEL
   ============================================= */
.spell-dc-bar {
  display: flex;
  gap: 1rem;
  margin-bottom: 1.5rem;
}

.spell-stat {
  flex: 1;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 0.8rem;
  text-align: center;
}

.spell-stat-value {
  font-family: var(--font-h);
  font-size: 1.6rem;
  color: var(--purple2);
}

.spell-slots-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.6rem;
  margin-bottom: 1.5rem;
}

.slot-box {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 0.6rem;
  text-align: center;
}

.slot-level {
  font-family: var(--font-h);
  font-size: 0.65rem;
  color: var(--text-dim);
  display: block;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

.slot-pips {
  display: flex;
  justify-content: center;
  gap: 3px;
  margin: 4px 0;
}

.slot-pip {
  width: 10px; height: 10px;
  border-radius: 50%;
  border: 1px solid var(--purple2);
  cursor: pointer;
  transition: background 0.15s;
}
.slot-pip.used { background: transparent; border-color: var(--border2); }
.slot-pip.available { background: var(--purple2); }

.spell-entry {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.4rem 0.6rem;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  font-size: 0.9rem;
  cursor: pointer;
  transition: background 0.15s;
}

.spell-entry:hover { background: rgba(106,42,154,0.1); }

.spell-prepared-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  border: 1px solid var(--purple2);
  flex-shrink: 0;
  transition: background 0.15s;
}
.spell-entry.prepared .spell-prepared-dot { background: var(--purple2); }

.spell-entry-name { flex: 1; }
.spell-entry-school {
  font-size: 0.7rem;
  color: var(--text-dim);
  font-style: italic;
}
.spell-ritual-tag {
  font-size: 0.6rem;
  background: rgba(201,168,76,0.1);
  color: var(--gold);
  border: 1px solid var(--gold-dim);
  padding: 1px 4px;
  border-radius: 3px;
}

/* =============================================
   APPEARANCE PANEL
   ============================================= */
.image-upload-zone {
  border: 2px dashed var(--border2);
  border-radius: var(--r2);
  padding: 2rem;
  text-align: center;
  cursor: pointer;
  transition: all 0.3s;
  position: relative;
  overflow: hidden;
}

.image-upload-zone:hover {
  border-color: var(--gold-dim);
  background: rgba(201,168,76,0.03);
}

.image-upload-zone.has-image {
  padding: 0;
  border-style: solid;
  border-color: var(--gold-dim);
}

.image-preview {
  width: 100%;
  max-height: 300px;
  object-fit: cover;
  border-radius: var(--r);
}

.image-upload-hint {
  font-family: var(--font-h);
  font-size: 0.8rem;
  color: var(--text-dim);
  letter-spacing: 0.1em;
}

/* =============================================
   CHARACTER LIST PAGE
   ============================================= */
.chars-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr));
  gap: 1.5rem;
  padding: 1.5rem 0;
}

.char-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r2);
  overflow: hidden;
  cursor: pointer;
  transition: all 0.3s;
  position: relative;
}

.char-card:hover {
  border-color: var(--gold-dim);
  transform: translateY(-4px);
  box-shadow: 0 12px 40px rgba(0,0,0,0.6), 0 0 20px rgba(201,168,76,0.08);
}

.char-card-image {
  height: 180px;
  background: linear-gradient(135deg, var(--surface2), var(--bg2));
  position: relative;
  overflow: hidden;
}

.char-card-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.8;
}

.char-card-placeholder {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 3rem;
  color: var(--border2);
}

.char-card-level-badge {
  position: absolute;
  top: 8px; right: 8px;
  background: rgba(0,0,0,0.8);
  border: 1px solid var(--gold-dim);
  border-radius: 50px;
  padding: 2px 8px;
  font-family: var(--font-h);
  font-size: 0.7rem;
  color: var(--gold);
}

.char-card-body { padding: 1rem; }

.char-card-name {
  font-family: var(--font-h);
  font-size: 1.1rem;
  color: var(--white);
  margin-bottom: 0.3rem;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.char-card-class {
  font-size: 0.85rem;
  color: var(--text2);
}

.char-card-meta {
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
  margin-top: 0.5rem;
}

.meta-tag {
  font-size: 0.68rem;
  font-family: var(--font-h);
  padding: 2px 8px;
  border-radius: 50px;
  border: 1px solid var(--border);
  color: var(--text-dim);
  letter-spacing: 0.05em;
}

.char-card-actions {
  display: flex;
  gap: 0.5rem;
  padding: 0.8rem 1rem;
  border-top: 1px solid var(--border);
}

/* New character card */
.char-card-new {
  border: 2px dashed var(--border2);
  background: transparent;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 300px;
  transition: all 0.3s;
}

.char-card-new:hover {
  border-color: var(--gold-dim);
  background: rgba(201,168,76,0.03);
  transform: translateY(-4px);
}

.char-card-new-icon {
  font-size: 2.5rem;
  color: var(--border2);
  transition: color 0.3s;
  margin-bottom: 0.8rem;
}
.char-card-new:hover .char-card-new-icon { color: var(--gold-dim); }

/* =============================================
   VIEW PAGE (character sheet view)
   ============================================= */
.view-header {
  position: relative;
  padding-top: 80px;
  padding-bottom: 2rem;
  overflow: hidden;
}

.view-header-bg {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center top;
  opacity: 0.15;
  filter: blur(8px);
}

.view-header-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, transparent 40%, var(--bg) 100%);
}

.view-header-content {
  position: relative;
  z-index: 1;
  display: flex;
  gap: 2rem;
  align-items: flex-end;
  padding: 0 clamp(1rem, 4vw, 2rem);
}

.view-portrait {
  width: clamp(100px, 20vw, 160px);
  height: clamp(100px, 20vw, 160px);
  border-radius: var(--r2);
  border: 2px solid var(--gold-dim);
  object-fit: cover;
  flex-shrink: 0;
  box-shadow: 0 8px 30px rgba(0,0,0,0.6);
}

.view-portrait-placeholder {
  width: clamp(100px, 20vw, 160px);
  height: clamp(100px, 20vw, 160px);
  border-radius: var(--r2);
  border: 2px solid var(--border2);
  background: var(--surface2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 3rem;
  flex-shrink: 0;
}

.view-name { font-family: var(--font-deco); color: var(--white); }
.view-class { color: var(--gold); font-family: var(--font-h); margin: 0.2rem 0; }
.view-tags { display: flex; gap: 0.5rem; flex-wrap: wrap; }

.view-body { padding: 0 clamp(1rem, 4vw, 2rem) 3rem; }

.view-section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r2);
  padding: 1.5rem;
  margin-bottom: 1.5rem;
}

.view-section-title {
  font-family: var(--font-h);
  font-size: 1rem;
  color: var(--gold);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 1rem;
  padding-bottom: 0.5rem;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

/* =============================================
   STEP INDICATOR
   ============================================= */
.step-indicator {
  display: flex;
  justify-content: center;
  gap: 0.4rem;
  padding: 0.8rem 0;
}

.step-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--border2);
  transition: all 0.3s;
}
.step-dot.active { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
.step-dot.done { background: rgba(201,168,76,0.4); }

/* =============================================
   NOTIFICATIONS / TOASTS
   ============================================= */
.toast-container {
  position: fixed;
  top: 0;
  left: 0; right: 0;
  z-index: 999;
  display: flex;
  justify-content: center;
  pointer-events: none;
}

.toast {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-top: -60px;
  background: rgba(20, 24, 38, 0.82);
  backdrop-filter: blur(14px) saturate(160%);
  -webkit-backdrop-filter: blur(14px) saturate(160%);
  border: 1px solid rgba(201, 168, 76, 0.25);
  border-radius: 50px;
  padding: 0.45rem 1.1rem;
  font-family: var(--font-h);
  font-size: 0.78rem;
  color: var(--text2);
  letter-spacing: 0.08em;
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
  opacity: 0;
  transition: margin-top 0.45s cubic-bezier(0.34, 1.3, 0.64, 1), opacity 0.4s ease;
}

.toast.show {
  margin-top: 0.8rem;
  opacity: 1;
}

.toast-icon { font-size: 0.85rem; line-height: 1; }

.toast.success { border-color: rgba(201, 168, 76, 0.3); }
.toast.success .toast-icon { color: var(--gold2); }
.toast.error { border-color: rgba(196, 43, 43, 0.5); color: #e89a9a; }
.toast.error .toast-icon { color: var(--red2); }
.toast.info .toast-icon { color: #6ab0d8; }

/* =============================================
   DIVIDERS & DECORATIONS
   ============================================= */
.deco-divider {
  display: flex;
  align-items: center;
  gap: 1rem;
  margin: 1.5rem 0;
  color: var(--text-dim);
}
.deco-divider::before,
.deco-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--border2));
}
.deco-divider::after {
  background: linear-gradient(90deg, var(--border2), transparent);
}

.section-hint {
  font-size: 0.85rem;
  color: var(--text-dim);
  font-style: italic;
  padding: 0.5rem 0;
}

/* =============================================
   SELECTION GRID (race/class/bg picker)
   ============================================= */
.picker-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(140px, 45%), 1fr));
  gap: 0.8rem;
}

.picker-item {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 0.8rem;
  cursor: pointer;
  text-align: center;
  transition: all 0.2s;
}

.picker-item:hover {
  border-color: var(--gold-dim);
  background: rgba(201,168,76,0.04);
}

.picker-item.selected {
  border-color: var(--gold);
  background: rgba(201,168,76,0.08);
  box-shadow: 0 0 15px rgba(201,168,76,0.1);
}

.picker-item-icon { font-size: 1.5rem; margin-bottom: 0.3rem; }

.picker-item-name {
  font-family: var(--font-h);
  font-size: 0.75rem;
  letter-spacing: 0.05em;
  color: var(--text);
}
.picker-item.selected .picker-item-name { color: var(--gold); }

.picker-item-desc {
  font-size: 0.7rem;
  color: var(--text-dim);
  margin-top: 0.3rem;
  line-height: 1.3;
}

/* =============================================
   SAVING THROWS
   ============================================= */
.saves-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 0.4rem;
}

.save-row {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.9rem;
  padding: 0.3rem 0.4rem;
}

.save-dot {
  width: 12px; height: 12px;
  border-radius: 50%;
  border: 1px solid var(--border2);
  flex-shrink: 0;
}
.save-row.proficient .save-dot { background: var(--gold); border-color: var(--gold); }

/* =============================================
   RESPONSIVE BREAKPOINTS
   ============================================= */

/* Tablet */
@media (max-width: 768px) {
  .section-panel { width: 100vw; border-left: none; border-top: 1px solid var(--border); }
  .section-panel.open { transform: translateX(0); }

  .ability-grid { grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
  .ability-box-score { font-size: 1.6rem; }

  .combat-stats-grid { grid-template-columns: repeat(3, 1fr); }

  .currency-grid { grid-template-columns: repeat(5, 1fr); gap: 0.3rem; }

  .spell-slots-grid { grid-template-columns: repeat(3, 1fr); }

  .picker-grid { grid-template-columns: repeat(2, 1fr); }

  .view-header-content { flex-direction: column; align-items: flex-start; gap: 1rem; }

  .saves-grid { grid-template-columns: 1fr; }
}

/* Mobile */
@media (max-width: 480px) {
  .compass-container { width: 95vw; height: 95vw; }

  .ability-grid { grid-template-columns: repeat(2, 1fr); }

  .combat-stats-grid { grid-template-columns: repeat(2, 1fr); }

  .chars-grid { grid-template-columns: 1fr; }

  .spell-slots-grid { grid-template-columns: repeat(3, 1fr); }

  .picker-grid { grid-template-columns: repeat(2, 1fr); }

  .navbar { padding: 0.6rem 1rem; }
}

/* =============================================
   ANIMATIONS
   ============================================= */

@keyframes compassSpin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

@keyframes floatY {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

@keyframes textPulse {
  0%, 100% { text-shadow: 0 0 10px var(--gold), 0 0 30px rgba(201,168,76,0.4); }
  50% { text-shadow: 0 0 15px var(--gold), 0 0 50px rgba(201,168,76,0.5), 0 0 80px rgba(201,168,76,0.15); }
}

@keyframes pulse {
  0%, 100% { box-shadow: 0 0 10px var(--gold), 0 0 20px rgba(201,168,76,0.3); }
  50% { box-shadow: 0 0 20px var(--gold), 0 0 40px rgba(201,168,76,0.5); }
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes slideInRight {
  from { opacity: 0; transform: translateX(40px); }
  to { opacity: 1; transform: translateX(0); }
}

@keyframes fadeOut {
  to { opacity: 0; }
}

@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}

.animate-in { animation: fadeIn 0.4s ease forwards; }

/* Rune decoration */
.rune-border {
  border: 1px solid var(--gold-dim);
  position: relative;
}
.rune-border::after {
  content: '✦';
  position: absolute;
  top: -8px; left: 50%;
  transform: translateX(-50%);
  background: var(--bg);
  padding: 0 4px;
  color: var(--gold-dim);
  font-size: 0.8rem;
}

/* Gold shimmer on titles */
.shimmer {
  background: linear-gradient(90deg, var(--gold) 0%, var(--gold2) 50%, var(--gold) 100%);
  background-size: 200% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: shimmer 3s linear infinite;
}

/* Loading spinner */
.spinner {
  width: 30px; height: 30px;
  border: 2px solid var(--border2);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: compassSpin 0.8s linear infinite;
  margin: 2rem auto;
}

/* Inert when section not yet unlocked */
.compass-section.locked {
  opacity: 0.4;
  cursor: not-allowed;
  pointer-events: none;
}

/* Custom powers / features */
.feature-entry {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 0.8rem;
  margin-bottom: 0.6rem;
}

.feature-entry-name {
  font-family: var(--font-h);
  font-size: 0.9rem;
  color: var(--gold);
  margin-bottom: 0.3rem;
}

.feature-entry-desc {
  font-size: 0.85rem;
  color: var(--text2);
  line-height: 1.5;
}

/* =============================================
   ATTACK CARDS (weapons with rules)
   ============================================= */
.attack-card {
  background: rgba(26, 26, 46, 0.55);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 0.7rem;
  margin-bottom: 0.6rem;
  transition: border-color 0.2s;
}
.attack-card:hover { border-color: var(--border2); }

.attack-card-head {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-bottom: 0.6rem;
}

.attack-name {
  flex: 1;
  background: transparent !important;
  border: none !important;
  border-bottom: 1px solid var(--border) !important;
  border-radius: 0 !important;
  color: var(--white) !important;
  font-family: var(--font-h);
  font-size: 0.95rem;
  padding: 0.2rem 0 !important;
}

.attack-toggle {
  background: rgba(201, 168, 76, 0.08);
  border: 1px solid var(--gold-dim);
  color: var(--gold);
  font-family: var(--font-h);
  font-size: 0.68rem;
  letter-spacing: 0.05em;
  padding: 0.3rem 0.6rem;
  border-radius: 50px;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
}
.attack-toggle:hover { background: rgba(201, 168, 76, 0.18); }

.attack-card-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.5rem;
}

.attack-stat {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 0.4rem 0.5rem;
  text-align: center;
}

.attack-stat-label {
  display: block;
  font-family: var(--font-h);
  font-size: 0.55rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 0.2rem;
}

.attack-stat input {
  width: 100%;
  background: transparent !important;
  border: none !important;
  text-align: center;
  font-family: var(--font-h);
  font-size: 1rem;
  padding: 0 !important;
}
.attack-stat input.atk-bonus { color: var(--gold) !important; }
.attack-stat input.atk-dmg { color: #e89a9a !important; }
.attack-stat input.atk-type { color: var(--text2) !important; font-size: 0.8rem; }

.attack-rules {
  margin-top: 0.7rem;
  padding-top: 0.7rem;
  border-top: 1px solid var(--border);
  animation: fadeIn 0.3s ease;
}

.rules-title {
  font-family: var(--font-h);
  font-size: 0.8rem;
  color: var(--gold);
  letter-spacing: 0.08em;
  margin-bottom: 0.5rem;
}

.rules-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
}
.rules-list li {
  font-size: 0.82rem;
  line-height: 1.5;
  color: var(--text2);
  padding-left: 1rem;
  position: relative;
}
.rules-list li::before {
  content: '◆';
  position: absolute;
  left: 0;
  color: var(--gold-dim);
  font-size: 0.6rem;
  top: 0.25rem;
}

.rules-meta {
  margin-top: 0.6rem;
  font-size: 0.75rem;
  color: var(--text-dim);
  background: var(--bg2);
  border-radius: var(--r);
  padding: 0.5rem 0.7rem;
}
.rules-meta strong { color: var(--text2); }

/* =============================================
   SPELL BUDGET BOX
   ============================================= */
.spell-budget {
  background: linear-gradient(135deg, rgba(58, 26, 90, 0.35), rgba(26, 58, 107, 0.25));
  border: 1px solid rgba(106, 42, 154, 0.35);
  border-radius: var(--r2);
  padding: 1rem;
  margin-bottom: 1.2rem;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

.spell-budget-title {
  font-family: var(--font-h);
  font-size: 0.82rem;
  color: var(--gold2);
  margin-bottom: 0.7rem;
  letter-spacing: 0.05em;
}

.spell-budget-row {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.spell-budget-pill {
  background: rgba(8, 8, 16, 0.5);
  border: 1px solid rgba(106, 42, 154, 0.4);
  border-radius: 50px;
  padding: 0.35rem 0.8rem;
  font-size: 0.78rem;
  color: var(--text2);
}
.spell-budget-pill strong { color: #b98ad8; font-family: var(--font-h); }

.spell-budget-current {
  margin-top: 0.7rem;
  font-size: 0.78rem;
  color: var(--text-dim);
}
.spell-budget-current strong { color: var(--gold); }

/* =============================================
   SPELL LEVEL HEADERS + ENTRY BUTTONS
   ============================================= */
.spell-level-header {
  font-family: var(--font-h);
  font-size: 0.72rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--purple2);
  margin: 0.9rem 0 0.4rem;
  padding-bottom: 0.25rem;
  border-bottom: 1px solid rgba(106, 42, 154, 0.25);
}
.spell-level-header:first-child { margin-top: 0; }

.spell-entry-name { cursor: pointer; }
.spell-entry-name:hover { color: var(--gold); }

.spell-info-btn, .spell-add-btn {
  width: 26px; height: 26px;
  border-radius: 50%;
  border: 1px solid var(--border2);
  background: var(--bg2);
  color: var(--text2);
  cursor: pointer;
  font-size: 0.8rem;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.18s;
}
.spell-info-btn:hover { border-color: #6ab0d8; color: #6ab0d8; }
.spell-add-btn:hover { border-color: var(--gold); color: var(--gold); }

.spell-entry.dimmed { opacity: 0.45; }
.spell-entry.dimmed .spell-add-btn { color: var(--gold); border-color: var(--gold-dim); }

/* =============================================
   SPELL DETAIL MODAL
   ============================================= */
.spell-modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(4, 6, 14, 0.78);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1rem;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.28s ease;
}
.spell-modal-overlay.open { opacity: 1; pointer-events: all; }

.spell-modal-card {
  background: linear-gradient(160deg, rgba(28, 26, 48, 0.97), rgba(16, 16, 30, 0.97));
  border: 1px solid rgba(106, 42, 154, 0.45);
  border-radius: var(--r2);
  padding: 1.5rem;
  max-width: 460px;
  width: 100%;
  max-height: 85vh;
  overflow-y: auto;
  position: relative;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), 0 0 40px rgba(106, 42, 154, 0.15);
  transform: scale(0.92) translateY(20px);
  transition: transform 0.3s cubic-bezier(0.34, 1.3, 0.64, 1);
}
.spell-modal-overlay.open .spell-modal-card { transform: scale(1) translateY(0); }

.spell-modal-close {
  position: absolute;
  top: 0.8rem; right: 0.8rem;
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--bg2);
  border: 1px solid var(--border2);
  color: var(--text-dim);
  cursor: pointer;
  font-size: 0.9rem;
  transition: all 0.2s;
}
.spell-modal-close:hover { border-color: var(--red2); color: var(--red2); }

.spell-modal-level {
  display: inline-block;
  font-family: var(--font-h);
  font-size: 0.68rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #b98ad8;
  background: rgba(106, 42, 154, 0.2);
  border: 1px solid rgba(106, 42, 154, 0.4);
  border-radius: 50px;
  padding: 0.25rem 0.7rem;
  margin-bottom: 0.6rem;
}
.spell-modal-level.cantrip {
  color: var(--gold2);
  background: rgba(201, 168, 76, 0.12);
  border-color: var(--gold-dim);
}

.spell-modal-name {
  font-family: var(--font-deco);
  font-size: 1.5rem;
  color: var(--white);
  margin-bottom: 0.5rem;
}

.spell-modal-tags { display: flex; gap: 0.4rem; margin-bottom: 1rem; }
.spell-modal-tag {
  font-size: 0.7rem;
  font-family: var(--font-h);
  color: var(--text2);
  border: 1px solid var(--border2);
  border-radius: 50px;
  padding: 0.2rem 0.6rem;
}
.spell-modal-tag.ritual { color: var(--gold); border-color: var(--gold-dim); }

.spell-modal-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.5rem;
  margin-bottom: 1.2rem;
}
.spell-modal-grid > div {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 0.5rem 0.6rem;
}
.smg-label {
  display: block;
  font-family: var(--font-h);
  font-size: 0.58rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 0.15rem;
}
.smg-val { font-size: 0.85rem; color: var(--text); }

.spell-modal-section-title {
  font-family: var(--font-h);
  font-size: 0.75rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 0.4rem;
}

.spell-modal-desc {
  font-size: 0.9rem;
  line-height: 1.65;
  color: var(--text);
  margin-bottom: 0.8rem;
}

.spell-modal-school-note {
  font-size: 0.78rem;
  font-style: italic;
  color: var(--text-dim);
  border-left: 2px solid var(--purple2);
  padding-left: 0.7rem;
  margin-bottom: 0.8rem;
}

.spell-modal-classes {
  font-size: 0.75rem;
  color: var(--text-dim);
  font-family: var(--font-h);
  letter-spacing: 0.05em;
}

/* =============================================
   "WATERY" / GLASSMORPHIC OVERHAUL
   ============================================= */

/* Deep, flowing background with subtle aurora */
body {
  background:
    radial-gradient(ellipse 80% 60% at 20% 0%, rgba(26, 40, 80, 0.35), transparent 60%),
    radial-gradient(ellipse 70% 50% at 90% 100%, rgba(58, 26, 90, 0.3), transparent 60%),
    radial-gradient(ellipse 60% 80% at 50% 50%, rgba(10, 14, 30, 0.4), transparent 70%),
    #06070e;
  background-attachment: fixed;
}

/* Animated aurora layer */
body::before {
  content: '';
  position: fixed;
  inset: -20%;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(circle 320px at 25% 30%, rgba(42, 90, 170, 0.12), transparent),
    radial-gradient(circle 380px at 80% 70%, rgba(106, 42, 154, 0.1), transparent),
    radial-gradient(circle 280px at 60% 20%, rgba(201, 168, 76, 0.06), transparent);
  animation: auroraDrift 24s ease-in-out infinite alternate;
  filter: blur(20px);
}

@keyframes auroraDrift {
  0%   { transform: translate(0, 0) scale(1); }
  50%  { transform: translate(3%, -2%) scale(1.08); }
  100% { transform: translate(-2%, 3%) scale(1.04); }
}

/* Glassmorphic cards */
.card {
  background: rgba(18, 18, 31, 0.62);
  backdrop-filter: blur(14px) saturate(140%);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
}

.view-section {
  background: rgba(18, 18, 31, 0.62);
  backdrop-filter: blur(14px) saturate(140%);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
}

/* Glassmorphic side panel */
.section-panel {
  background: rgba(14, 15, 26, 0.92);
  backdrop-filter: blur(24px) saturate(150%);
  -webkit-backdrop-filter: blur(24px) saturate(150%);
}

.section-panel-header {
  background: rgba(26, 26, 46, 0.6);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

/* Glassmorphic compass center */
.compass-center {
  background:
    radial-gradient(circle at 38% 32%, rgba(42, 70, 130, 0.4), rgba(8, 10, 22, 0.95));
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

/* Compass nodes — watery glass orbs */
.compass-section {
  background:
    radial-gradient(circle at 32% 28%, rgba(70, 110, 180, 0.35), rgba(16, 18, 34, 0.85));
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  box-shadow: inset 0 2px 8px rgba(120, 170, 230, 0.12), 0 4px 14px rgba(0, 0, 0, 0.5);
}

.compass-section:hover {
  background:
    radial-gradient(circle at 32% 28%, rgba(100, 150, 220, 0.5), rgba(20, 24, 44, 0.9));
}

/* Buttons — glossy water sheen */
.btn-primary {
  background: linear-gradient(135deg, #b8923c 0%, #e8c96a 50%, #c9a84c 100%);
  background-size: 200% auto;
  transition: all 0.4s ease, background-position 0.5s ease;
}
.btn-primary:hover { background-position: right center; }

/* Input fields — soft glass */
input[type="text"], input[type="number"], input[type="email"],
textarea, select {
  background: rgba(8, 10, 22, 0.7);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
}
input:focus, textarea:focus, select:focus {
  background: rgba(12, 14, 28, 0.85);
}

/* Stat / ability boxes — subtle aqueous tint */
.stat-box, .ability-box, .slot-box {
  background: rgba(13, 16, 30, 0.7);
  transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
}
.stat-box:hover, .ability-box:hover {
  box-shadow: inset 0 1px 10px rgba(100, 150, 220, 0.08);
}

/* Picker items — glass tiles */
.picker-item {
  background: rgba(13, 16, 30, 0.65);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
.picker-item.selected {
  background: linear-gradient(135deg, rgba(201, 168, 76, 0.14), rgba(70, 110, 180, 0.1));
}

/* Char cards — glass */
.char-card {
  background: rgba(18, 18, 31, 0.66);
  backdrop-filter: blur(12px) saturate(140%);
  -webkit-backdrop-filter: blur(12px) saturate(140%);
}

/* Smoother global transitions */
.btn, .compass-section, .picker-item, .char-card,
.skill-row, .spell-entry, .attack-card {
  transition-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

/* Flowing shimmer on dividers */
.deco-divider::before, .deco-divider::after {
  background: linear-gradient(90deg, transparent, rgba(120, 170, 230, 0.3), var(--border2));
}

/* =============================================
   iPHONE / MOBILE SPACE OPTIMIZATION
   ============================================= */
@media (max-width: 768px) {
  .section-panel-body { padding: 1rem; }
  .section-panel-header { padding: 0.9rem 1rem; }
  .section-panel-footer { padding: 0.8rem 1rem; }

  .spell-modal-card { padding: 1.2rem; }
  .spell-modal-name { font-size: 1.25rem; }

  .attack-card-stats { gap: 0.35rem; }
  .attack-stat { padding: 0.35rem 0.3rem; }

  .deco-divider { margin: 1.1rem 0; }
}

@media (max-width: 480px) {
  html { font-size: 15px; }

  .compass-page-layout { padding: 1rem 0.7rem 1.5rem; gap: 1rem; }
  .compass-guide { padding: 0.5rem 0.9rem; font-size: 0.74rem; }

  .section-panel-body { padding: 0.9rem; }

  .ability-grid { gap: 0.5rem; }
  .ability-box { padding: 0.7rem 0.5rem; }
  .ability-box-score { font-size: 1.5rem; }
  .ability-box-modifier { width: 34px; height: 34px; font-size: 0.85rem; }

  .combat-stats-grid { gap: 0.5rem; }
  .stat-box { padding: 0.6rem 0.4rem; }
  .stat-box-value { font-size: 1.3rem; }

  .spell-slots-grid { gap: 0.4rem; }
  .spell-dc-bar { gap: 0.5rem; }
  .spell-budget { padding: 0.8rem; }

  .currency-grid { gap: 0.25rem; }
  .currency-item { padding: 0.4rem 0.2rem; }

  .picker-grid { gap: 0.5rem; }
  .picker-item { padding: 0.6rem 0.4rem; }

  .btn { padding: 0.65rem 1.2rem; font-size: 0.82rem; }
  .btn-lg { padding: 0.85rem 1.6rem; }

  .compass-actions { width: 100%; }
  .compass-actions .btn { flex: 1; min-width: 0; }

  .attack-card-stats { grid-template-columns: repeat(3, 1fr); }

  .spell-modal-grid { grid-template-columns: 1fr 1fr; gap: 0.4rem; }

  .toast { font-size: 0.72rem; padding: 0.4rem 0.9rem; }

  .view-body { padding-left: 0.7rem; padding-right: 0.7rem; }
  .view-section { padding: 1rem; }
}

/* Tap targets — comfortable on touch */
@media (pointer: coarse) {
  .skill-check, .save-dot, .slot-pip, .spell-prepared-dot {
    min-width: 22px;
    min-height: 22px;
  }
  .compass-section { -webkit-tap-highlight-color: transparent; }
}

/* =============================================
   PRINT STYLES
   ============================================= */
@media print {
  body { background: white; color: black; }
  body::before { display: none; }
  .navbar, #particles-canvas, .btn, .section-panel { display: none; }
  .view-header-bg { opacity: 0.05; }
  .card, .view-section { border: 1px solid #ccc; }
}

/* =============================================
   CLASS THEMING — colors & particles per class
   ============================================= */

/* ---- Character list cards ---- */
.char-card:hover {
  border-color: var(--cc, var(--gold-dim));
  box-shadow: 0 14px 44px rgba(0,0,0,0.62), 0 0 28px var(--ccglow, rgba(201,168,76,0.1));
}

.char-card-image {
  background: radial-gradient(ellipse at 50% 125%, var(--ccglow, rgba(201,168,76,0.12)), var(--bg2) 72%);
}
.char-card-image::after {
  content: '';
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--cc, var(--gold)), transparent);
  z-index: 3;
}

.char-card-placeholder { color: var(--cc, var(--border2)); opacity: 0.55; }
.char-card-level-badge { border-color: var(--cc, var(--gold-dim)); color: var(--cc, var(--gold)); }
.char-card-class { color: var(--cc, var(--text2)); font-family: var(--font-h); font-size: 0.82rem; }

.char-card-class-tag {
  position: absolute;
  top: 8px; left: 8px;
  z-index: 4;
  font-family: var(--font-h);
  font-size: 0.58rem;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--cc, var(--gold));
  background: rgba(4, 5, 12, 0.78);
  border: 1px solid var(--cc, var(--gold-dim));
  border-radius: 50px;
  padding: 2px 8px;
}

/* ---- CSS particles inside card image ---- */
.card-particles {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 2;
}
.card-particles span {
  position: absolute;
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--cc, var(--gold));
  box-shadow: 0 0 8px var(--cc, var(--gold)), 0 0 14px var(--ccglow, transparent);
  opacity: 0;
}
.card-particles span:nth-child(1) { left: 12%; animation-delay: 0s; }
.card-particles span:nth-child(2) { left: 27%; animation-delay: 1.3s; }
.card-particles span:nth-child(3) { left: 42%; animation-delay: 2.6s; }
.card-particles span:nth-child(4) { left: 57%; animation-delay: 0.8s; }
.card-particles span:nth-child(5) { left: 71%; animation-delay: 2.0s; }
.card-particles span:nth-child(6) { left: 85%; animation-delay: 3.3s; }
.card-particles span:nth-child(7) { left: 50%; animation-delay: 1.7s; }

.char-card.motion-rise  .card-particles span { animation: cardRise 5s ease-in infinite; }
.char-card.motion-fall  .card-particles span { animation: cardFall 6.5s ease-out infinite; }
.char-card.motion-float .card-particles span { animation: cardFloat 6s ease-in-out infinite; }

@keyframes cardRise {
  0%   { bottom: -10px; opacity: 0; transform: scale(0.5); }
  20%  { opacity: 0.95; }
  80%  { opacity: 0.6; }
  100% { bottom: 102%; opacity: 0; transform: scale(1.05); }
}
@keyframes cardFall {
  0%   { top: -10px; opacity: 0; transform: scale(0.5) translateX(0); }
  20%  { opacity: 0.9; }
  80%  { opacity: 0.55; }
  100% { top: 102%; opacity: 0; transform: scale(1) translateX(16px); }
}
@keyframes cardFloat {
  0%   { top: 85%; opacity: 0; transform: scale(0.45); }
  25%  { opacity: 0.95; }
  50%  { transform: scale(1.15) translateX(9px); }
  75%  { opacity: 0.6; }
  100% { top: 10%; opacity: 0; transform: scale(0.7) translateX(-7px); }
}

/* ---- Compass themed by selected class ---- */
.compass-center {
  border-color: var(--class-color, var(--gold-dim));
  box-shadow: 0 0 36px var(--class-glow, rgba(201,168,76,0.1)), inset 0 0 30px rgba(0,0,0,0.55);
}
.compass-center-icon {
  font-size: 1.7rem;
  margin-bottom: 0.3rem;
  line-height: 1;
  animation: floatY 3s ease-in-out infinite;
  filter: drop-shadow(0 0 8px var(--class-glow, rgba(201,168,76,0.3)));
}
.compass-center-name { color: var(--class-color, var(--gold)); }

.compass-section.active::before {
  border-color: var(--class-color, var(--gold));
  box-shadow: 0 0 16px var(--class-color, var(--gold)), 0 0 34px var(--class-glow, rgba(201,168,76,0.3));
}
.compass-section.active .compass-section-label { color: var(--class-color, var(--gold)); }
.compass-section.completed::before { border-color: var(--class-glow, rgba(201,168,76,0.5)); }
.compass-section.completed .compass-section-icon::after { color: var(--class-color, var(--gold)); }
.compass-section:hover {
  border-color: var(--class-color, var(--gold-dim));
  box-shadow: 0 0 22px var(--class-glow, rgba(201,168,76,0.2));
}
.compass-line {
  background: linear-gradient(90deg, var(--class-color, var(--gold-dim)), transparent);
}
.step-dot.active {
  background: var(--class-color, var(--gold));
  box-shadow: 0 0 8px var(--class-color, var(--gold));
}
.step-dot.done { background: var(--class-glow, rgba(201,168,76,0.4)); }

/* ---- View page themed by class ---- */
.view-section-title { color: var(--class-color, var(--gold)); }
.view-class { color: var(--class-color, var(--gold)); }
.view-portrait { border-color: var(--class-color, var(--gold-dim)); }
.view-portrait-placeholder {
  border-color: var(--class-color, var(--border2));
  color: var(--class-color, var(--text-dim));
}

/* ---- Profile management buttons (index) ---- */
.profile-actions {
  margin-top: 1.3rem;
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  justify-content: center;
}
.btn-logout-danger {
  border-color: rgba(196, 43, 43, 0.45);
  color: #d98c8c;
}
.btn-logout-danger:hover {
  border-color: var(--red2);
  color: var(--red2);
  background: rgba(139, 26, 26, 0.15);
}

/* =============================================
   PROFILE PAGE — Gestione Giocatore
   ============================================= */
.profile-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding: 0.9rem 0;
  border-bottom: 1px solid var(--border);

.profile-row:last-of-type { border-bottom: none; }

.profile-row-label {
  font-family: var(--font-h);
  font-size: 0.68rem;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--text-dim);
}
.profile-row-value {
  font-family: var(--font-h);
  font-size: 1.15rem;
  color: var(--white);
  margin-top: 0.15rem;
}

/* Player type selector */
.player-type-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.8rem;
  margin-top: 0.6rem;
}
.player-type-option {
  background: rgba(13, 16, 30, 0.7);
  border: 1px solid var(--border);
  border-radius: var(--r2);
  padding: 1.1rem 0.8rem;
  text-align: center;
  cursor: pointer;
  transition: all 0.25s;
}
.player-type-option:hover { border-color: var(--gold-dim); transform: translateY(-2px); }
.player-type-option.selected {
  border-color: var(--gold);
  background: linear-gradient(135deg, rgba(201,168,76,0.14), rgba(70,110,180,0.08));
  box-shadow: 0 0 22px rgba(201,168,76,0.14);
}
.player-type-icon { font-size: 2rem; margin-bottom: 0.4rem; }
.player-type-name {
  font-family: var(--font-h);
  font-size: 1rem;
  color: var(--text);
  letter-spacing: 0.06em;
}
.player-type-option.selected .player-type-name { color: var(--gold); }
.player-type-desc {
  font-size: 0.76rem;
  color: var(--text-dim);
  margin-top: 0.3rem;
  line-height: 1.4;
}

/* Backup steps */
.backup-steps {
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
  margin-top: 0.9rem;
}
.backup-step {
  display: flex;
  align-items: center;
  gap: 0.7rem;
  font-size: 0.85rem;
  color: var(--text2);
  line-height: 1.45;
}
.backup-step-num {
  flex-shrink: 0;
  width: 26px; height: 26px;
  border-radius: 50%;
  background: rgba(201,168,76,0.12);
  border: 1px solid var(--gold-dim);
  color: var(--gold);
  font-family: var(--font-h);
  font-size: 0.85rem;
  display: flex;
  align-items: center;
  justify-content: center;
}
code {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 1px 5px;
  font-size: 0.85em;
  color: var(--gold2);
}

/* Player type badge */
.type-badge {
  display: inline-block;
  font-family: var(--font-h);
  font-size: 0.72rem;
  letter-spacing: 0.1em;
  color: var(--text2);
  background: rgba(13, 16, 30, 0.7);
  border: 1px solid var(--border2);
  border-radius: 50px;
  padding: 0.25rem 0.8rem;
}
.type-badge.master {
  color: var(--gold);
  border-color: var(--gold-dim);
  background: rgba(201, 168, 76, 0.1);
}

/* Navbar gear link — neutral/gold hover instead of red */
.navbar-user a.btn-logout {
  display: inline-flex;
  align-items: center;
  text-decoration: none;
}
.navbar-user a.btn-logout:hover {
  border-color: var(--gold);
  color: var(--gold);
}

@media (max-width: 480px) {
  .player-type-grid { grid-template-columns: 1fr; }
}

/* User chip — character count badge */
.user-chip-count {
  margin-left: auto;
  font-size: 0.66rem;
  font-family: var(--font-h);
  letter-spacing: 0.04em;
  background: rgba(201,168,76,0.12);
  border: 1px solid var(--gold-dim);
  color: var(--gold);
  border-radius: 50px;
  padding: 1px 8px;
}

// ============ STORAGE ============
// User & Character Storage (localStorage-based, multi-user)

const Storage = {
  KEYS: {
    currentUser: 'dnd_current_user',
    users: 'dnd_users',
    playerMeta: 'dnd_player_meta',
    characters: (user) => `dnd_characters_${user}`
  },

  getCurrentUser() {
    return localStorage.getItem(this.KEYS.currentUser);
  },

  setCurrentUser(username) {
    const clean = this.cleanUsername(username);
    if (!clean) return false;
    localStorage.setItem(this.KEYS.currentUser, clean);
    const users = this.getUsers();
    if (!users.includes(clean)) {
      users.push(clean);
      localStorage.setItem(this.KEYS.users, JSON.stringify(users));
    }
    return clean;
  },

  getUsers() {
    try {
      return JSON.parse(localStorage.getItem(this.KEYS.users) || '[]');
    } catch { return []; }
  },

  // Ripara stati incoerenti (chiavi utente con spazi create da una vecchia
  // versione di renameUser). Unisce i personaggi sotto la chiave pulita.
  // Idempotente: se non c'è nulla da riparare non scrive niente.
  migrate() {
    const rawUsers = this.getUsers();
    const cur = localStorage.getItem(this.KEYS.currentUser);
    const all = new Set(rawUsers);
    if (cur) all.add(cur);

    let touched = false;
    all.forEach(oldName => {
      const newName = this.cleanUsername(oldName);
      if (!newName || newName === oldName) return;
      touched = true;
      // Unisce i personaggi oldName -> newName (per id, senza perdite)
      const byId = {};
      this.getCharacters(newName).forEach(c => { if (c && c.id) byId[c.id] = c; });
      this.getCharacters(oldName).forEach(c => {
        if (!c) return;
        if (!c.id) c.id = this.generateId();
        byId[c.id] = c;
      });
      localStorage.setItem(this.KEYS.characters(newName), JSON.stringify(Object.values(byId)));
      localStorage.removeItem(this.KEYS.characters(oldName));
      // Metadati
      const meta = this._allMeta();
      if (meta[oldName]) {
        if (!meta[newName]) meta[newName] = meta[oldName];
        delete meta[oldName];
        this._saveMeta(meta);
      }
      // Utente corrente
      if (localStorage.getItem(this.KEYS.currentUser) === oldName) {
        localStorage.setItem(this.KEYS.currentUser, newName);
      }
    });

    if (touched) {
      const cleaned = [];
      rawUsers.forEach(u => {
        const n = this.cleanUsername(u) || u;
        if (n && !cleaned.includes(n)) cleaned.push(n);
      });
      const c = localStorage.getItem(this.KEYS.currentUser);
      if (c && !cleaned.includes(c)) cleaned.push(c);
      localStorage.setItem(this.KEYS.users, JSON.stringify(cleaned));
    }
  },

  logout() {
    localStorage.removeItem(this.KEYS.currentUser);
  },

  cleanUsername(name) {
    return (name || '').trim().toLowerCase().replace(/[^a-z0-9_\-àèìòù]/gi, '');
  },

  renameUser(oldName, newName) {
    const clean = this.cleanUsername(newName);
    if (!clean) return null;
    if (clean === oldName) return oldName;
    const users = this.getUsers();
    if (users.includes(clean)) return 'EXISTS';
    // Sposta i personaggi sotto la nuova chiave
    const chars = this.getCharacters(oldName);
    localStorage.setItem(this.KEYS.characters(clean), JSON.stringify(chars));
    localStorage.removeItem(this.KEYS.characters(oldName));
    // Sposta i metadati del giocatore
    const meta = this._allMeta();
    if (meta[oldName]) { meta[clean] = meta[oldName]; delete meta[oldName]; this._saveMeta(meta); }
    // Aggiorna la lista utenti
    const updated = users.filter(u => u !== oldName);
    updated.push(clean);
    localStorage.setItem(this.KEYS.users, JSON.stringify(updated));
    // Aggiorna l'utente corrente
    if (this.getCurrentUser() === oldName) {
      localStorage.setItem(this.KEYS.currentUser, clean);
    }
    return clean;
  },

  deleteUser(name) {
    if (!name) return false;
    localStorage.removeItem(this.KEYS.characters(name));
    const users = this.getUsers().filter(u => u !== name);
    localStorage.setItem(this.KEYS.users, JSON.stringify(users));
    const meta = this._allMeta();
    delete meta[name];
    this._saveMeta(meta);
    if (this.getCurrentUser() === name) this.logout();
    return true;
  },

  // ---- PLAYER METADATA (tipo giocatore, ecc.) ----
  _allMeta() {
    try { return JSON.parse(localStorage.getItem(this.KEYS.playerMeta) || '{}'); }
    catch { return {}; }
  },

  _saveMeta(meta) {
    localStorage.setItem(this.KEYS.playerMeta, JSON.stringify(meta));
  },

  getPlayerMeta(user) {
    const u = user || this.getCurrentUser();
    if (!u) return { type: 'player' };
    const meta = this._allMeta()[u] || {};
    return { type: meta.type || 'player' };
  },

  setPlayerMeta(user, partial) {
    const u = user || this.getCurrentUser();
    if (!u) return false;
    const all = this._allMeta();
    all[u] = { ...(all[u] || {}), ...partial };
    this._saveMeta(all);
    return true;
  },

  // ---- EXPORT / IMPORT (backup tra dispositivi) ----
  exportData(user) {
    const u = user || this.getCurrentUser();
    return {
      app: 'dnd-sheets',
      version: 1,
      exportedAt: new Date().toISOString(),
      player: u,
      playerType: this.getPlayerMeta(u).type,
      characters: this.getCharacters(u)
    };
  },

  importData(data, user) {
    const u = user || this.getCurrentUser();
    if (!u) return { ok: false, error: 'Nessun giocatore attivo' };
    if (!data || data.app !== 'dnd-sheets' || !Array.isArray(data.characters)) {
      return { ok: false, error: 'File non valido o non riconosciuto' };
    }
    // Unisce per id: aggiorna gli esistenti, aggiunge i nuovi
    const existing = this.getCharacters(u);
    const byId = {};
    existing.forEach(c => { byId[c.id] = c; });
    let added = 0, updated = 0;
    data.characters.forEach(c => {
      if (!c || typeof c !== 'object') return;
      if (!c.id) c.id = this.generateId();
      if (byId[c.id]) updated++; else added++;
      byId[c.id] = c;
    });
    localStorage.setItem(this.KEYS.characters(u), JSON.stringify(Object.values(byId)));
    // Importa anche il tipo giocatore se presente
    if (data.playerType) this.setPlayerMeta(u, { type: data.playerType });
    return { ok: true, added, updated };
  },

  getCharacters(user) {
    const u = user || this.getCurrentUser();
    if (!u) return [];
    try {
      return JSON.parse(localStorage.getItem(this.KEYS.characters(u)) || '[]');
    } catch { return []; }
  },

  saveCharacter(character, user) {
    const u = user || this.getCurrentUser();
    if (!u) return false;
    const chars = this.getCharacters(u);
    const idx = chars.findIndex(c => c.id === character.id);
    if (idx >= 0) {
      chars[idx] = { ...character, updatedAt: new Date().toISOString() };
    } else {
      chars.push({
        ...character,
        id: character.id || this.generateId(),
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      });
    }
    localStorage.setItem(this.KEYS.characters(u), JSON.stringify(chars));
    return true;
  },

  getCharacter(id, user) {
    const chars = this.getCharacters(user);
    return chars.find(c => c.id === id) || null;
  },

  deleteCharacter(id, user) {
    const u = user || this.getCurrentUser();
    if (!u) return false;
    const chars = this.getCharacters(u).filter(c => c.id !== id);
    localStorage.setItem(this.KEYS.characters(u), JSON.stringify(chars));
    return true;
  },

  generateId() {
    return 'char_' + Date.now() + '_' + Math.random().toString(36).slice(2, 9);
  },

  newCharacter() {
    return {
      id: this.generateId(),
      identity: {
        name: '', race: '', subrace: '', class: '', subclass: '',
        level: 1, background: '', alignment: '', xp: 0,
        deity: '', age: '', height: '', weight: '', eyes: '', hair: '', skin: ''
      },
      abilities: { str: 10, dex: 10, con: 10, int: 10, wis: 10, cha: 10 },
      skills: {},
      saving_throw_proficiencies: [],
      skill_proficiencies: [],
      tool_proficiencies: [],
      combat: {
        max_hp: 0, current_hp: 0, temp_hp: 0,
        armor_type: '', armor_ac: 10, shield: false,
        custom_ac: null, speed: 30,
        initiative_bonus: 0, death_saves: { successes: 0, failures: 0 },
        attacks: []
      },
      equipment: {
        items: [],
        currency: { cp: 0, sp: 0, ep: 0, gp: 0, pp: 0 }
      },
      spells: {
        spellcasting_class: '',
        spell_save_dc: 0,
        spell_attack_bonus: 0,
        slots_used: [0, 0, 0, 0, 0, 0, 0, 0, 0],
        prepared: [],
        known: []
      },
      story: {
        traits: '', ideals: '', bonds: '', flaws: '', backstory: '', notes: ''

      custom: {
