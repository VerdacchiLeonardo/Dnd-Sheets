<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#080810">
  <title>D&D Sheets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cinzel+Decorative:wght@400;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
/* =============================================
   D&D CHARACTER SHEETS — Global Styles
   Dark medieval-fantasy, responsive
   ============================================= */

@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cinzel+Decorative:wght@400;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap');

/* ---- Reset & Base ---- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:          #080810;
  --bg2:         #0d0d1a;
  --bg3:         #111122;
  --surface:     #12121f;
  --surface2:    #1a1a2e;
  --border:      #2a2a4a;
  --border2:     #3a3a5a;
  --gold:        #c9a84c;
  --gold2:       #e8c96a;
  --gold-dim:    #7a6020;
  --red:         #8b1a1a;
  --red2:        #c42b2b;
  --blue:        #1a3a6b;
  --blue2:       #2a5aaa;
  --purple:      #3a1a5a;
  --purple2:     #6a2a9a;
  --text:        #e8dcc8;
  --text2:       #c0b090;
  --text-dim:    #7a6a50;
  --white:       #f5f0e8;
  --glow:        rgba(201,168,76,0.15);
  --glow2:       rgba(201,168,76,0.3);
  --font-h:      'Cinzel', serif;
  --font-deco:   'Cinzel Decorative', serif;
  --font-b:      'EB Garamond', serif;
  --r:           8px;
  --r2:          16px;
  --shadow:      0 4px 20px rgba(0,0,0,0.8);
  --shadow2:     0 8px 40px rgba(0,0,0,0.9);
}

html { font-size: 16px; scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-b);
  font-size: 1rem;
  line-height: 1.6;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ---- Scrollbar ---- */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--gold); }

/* =============================================
   PARTICLES BACKGROUND
   ============================================= */
#particles-canvas {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  opacity: 0.5;
}

/* =============================================
   TYPOGRAPHY
   ============================================= */
h1, h2, h3, h4 { font-family: var(--font-h); letter-spacing: 0.08em; }
h1 { font-size: clamp(2rem, 6vw, 4rem); font-family: var(--font-deco); }
h2 { font-size: clamp(1.4rem, 4vw, 2.2rem); }
h3 { font-size: clamp(1.1rem, 3vw, 1.6rem); }
h4 { font-size: 1.1rem; }

.title-glow {
  color: var(--gold);
  text-shadow: 0 0 10px var(--gold), 0 0 30px rgba(201,168,76,0.4), 0 0 60px rgba(201,168,76,0.15);
  animation: textPulse 3s ease-in-out infinite;
}

.subtitle {
  font-family: var(--font-h);
  font-size: clamp(0.8rem, 2vw, 1rem);
  letter-spacing: 0.3em;
  color: var(--text-dim);
  text-transform: uppercase;
}

a { color: var(--gold); text-decoration: none; transition: color 0.2s; }
a:hover { color: var(--gold2); }

/* =============================================
   LAYOUT
   ============================================= */
.page-wrap {
  position: relative;
  z-index: 1;
  min-height: 100vh;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 clamp(1rem, 4vw, 2rem);
}

.center { text-align: center; }

/* =============================================
   NAVBAR
   ============================================= */
.navbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.8rem clamp(1rem, 4vw, 2rem);
  background: rgba(8,8,16,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}

.navbar-brand {
  font-family: var(--font-deco);
  font-size: 1.1rem;
  color: var(--gold);
  text-shadow: 0 0 8px rgba(201,168,76,0.5);
}

.navbar-user {
  display: flex;
  align-items: center;
  gap: 0.8rem;
}

.navbar-username {
  font-family: var(--font-h);
  font-size: 0.85rem;
  color: var(--text2);
  letter-spacing: 0.1em;
}

.btn-logout {
  font-size: 0.75rem;
  padding: 0.3rem 0.8rem;
  background: transparent;
  border: 1px solid var(--border2);
  color: var(--text-dim);
  cursor: pointer;
  border-radius: var(--r);
  font-family: var(--font-h);
  transition: all 0.2s;
}
.btn-logout:hover { border-color: var(--red2); color: var(--red2); }

/* =============================================
   BUTTONS
   ============================================= */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  padding: 0.75rem 1.8rem;
  font-family: var(--font-h);
  font-size: 0.9rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  cursor: pointer;
  border-radius: var(--r);
  border: none;
  transition: all 0.25s;
  position: relative;
  overflow: hidden;
  white-space: nowrap;
}

.btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.05), transparent);
  opacity: 0;
  transition: opacity 0.25s;
}
.btn:hover::before { opacity: 1; }

.btn-primary {
  background: linear-gradient(135deg, var(--gold-dim), var(--gold));
  color: #1a1000;
  box-shadow: 0 0 20px rgba(201,168,76,0.2);
}
.btn-primary:hover {
  background: linear-gradient(135deg, var(--gold), var(--gold2));
  box-shadow: 0 0 30px rgba(201,168,76,0.4), 0 0 60px rgba(201,168,76,0.15);
  transform: translateY(-1px);
}

.btn-secondary {
  background: transparent;
  color: var(--gold);
  border: 1px solid var(--gold-dim);
}
.btn-secondary:hover {
  border-color: var(--gold);
  box-shadow: 0 0 15px rgba(201,168,76,0.2);
  background: rgba(201,168,76,0.05);
}

.btn-danger {
  background: transparent;
  color: var(--red2);
  border: 1px solid var(--red);
}
.btn-danger:hover { background: rgba(139,26,26,0.2); border-color: var(--red2); }

.btn-sm { padding: 0.4rem 1rem; font-size: 0.78rem; }
.btn-lg { padding: 1rem 2.5rem; font-size: 1rem; }

.btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* =============================================
   CARDS
   ============================================= */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r2);
  padding: 1.5rem;
  position: relative;
  transition: all 0.3s;
}

.card::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: var(--r2);
  background: linear-gradient(135deg, rgba(201,168,76,0.03), transparent 60%);
  pointer-events: none;
}

.card:hover {
  border-color: var(--border2);
  box-shadow: var(--shadow);
  transform: translateY(-2px);
}

.card-gold {
  border-color: var(--gold-dim);
  box-shadow: 0 0 20px rgba(201,168,76,0.08);
}

/* =============================================
   FORMS
   ============================================= */
.form-group {
  margin-bottom: 1.2rem;
}

label {
  display: block;
  font-family: var(--font-h);
  font-size: 0.78rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--text2);
  margin-bottom: 0.4rem;
}

input[type="text"],
input[type="number"],
input[type="email"],
textarea,
select {
  width: 100%;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  color: var(--text);
  font-family: var(--font-b);
  font-size: 1rem;
  padding: 0.6rem 0.9rem;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  -webkit-appearance: none;
}

input:focus, textarea:focus, select:focus {
  border-color: var(--gold-dim);
  box-shadow: 0 0 0 2px rgba(201,168,76,0.1);
}

select option { background: var(--bg2); }

textarea {
  resize: vertical;
  min-height: 80px;
}

input[type="number"] { -moz-appearance: textfield; }
input[type="number"]::-webkit-inner-spin-button { display: none; }

/* Ability score input (compact) */
.ability-input {
  width: 60px !important;
  text-align: center;
  font-size: 1.2rem;
  font-family: var(--font-h);
}

/* Autocomplete */
.autocomplete-wrap { position: relative; }
.autocomplete-list {
  position: absolute;
  top: 100%;
  left: 0; right: 0;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-top: none;
  border-radius: 0 0 var(--r) var(--r);
  max-height: 200px;
  overflow-y: auto;
  z-index: 200;
  display: none;
}
.autocomplete-list.open { display: block; }
.autocomplete-item {
  padding: 0.5rem 0.9rem;
  cursor: pointer;
  font-size: 0.9rem;
  transition: background 0.15s;
  border-bottom: 1px solid var(--border);
}
.autocomplete-item:hover, .autocomplete-item.active {
  background: rgba(201,168,76,0.1);
  color: var(--gold);
}
.autocomplete-item small {
  display: block;
  font-size: 0.75rem;
  color: var(--text-dim);
  margin-top: 2px;
}

/* =============================================
   LANDING PAGE
   ============================================= */
.landing {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem clamp(1rem, 4vw, 2rem);
  text-align: center;
  position: relative;
}

.landing-logo {
  margin-bottom: 1rem;
  animation: floatY 4s ease-in-out infinite;
}

.landing-logo svg {
  width: clamp(60px, 12vw, 100px);
  height: auto;
  filter: drop-shadow(0 0 15px rgba(201,168,76,0.5));
}

.landing-title { margin-bottom: 0.5rem; }
.landing-subtitle { margin-bottom: 3rem; }

.landing-divider {
  width: 200px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
  margin: 1.5rem auto;
}

/* Login card */
.login-card {
  width: 100%;
  max-width: 420px;
  margin: 0 auto;
}

.login-card h2 {
  font-size: 1.3rem;
  color: var(--gold);
  margin-bottom: 1.5rem;
}

.login-options {
  display: flex;
  flex-direction: column;
  gap: 0.8rem;
  margin-top: 1rem;
}

.user-chip {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.6rem 1rem;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 50px;
  cursor: pointer;
  transition: all 0.2s;
  font-family: var(--font-h);
  font-size: 0.85rem;
  color: var(--text2);
}
.user-chip:hover { border-color: var(--gold-dim); color: var(--gold); }
.user-chip-icon { font-size: 1rem; }

/* =============================================
   COMPASS UI — Character Creation
   ============================================= */
.creation-page {
  padding-top: 80px;
  min-height: 100vh;
}

.compass-container {
  position: relative;
  width: min(580px, 95vw);
  height: min(580px, 95vw);
  margin: 0 auto;
}

.compass-ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 1px solid var(--border);
  animation: compassSpin 60s linear infinite;
}

.compass-ring-outer {
  border-color: var(--gold-dim);
  opacity: 0.3;
  animation-duration: 80s;
}

.compass-ring-inner {
  inset: 30px;
  border-color: var(--border2);
  opacity: 0.2;
  animation-direction: reverse;
  animation-duration: 40s;
}

.compass-center {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: min(160px, 30vw);
  height: min(160px, 30vw);
  border-radius: 50%;
  background: radial-gradient(circle at 40% 40%, var(--surface2), var(--bg));
  border: 2px solid var(--gold-dim);
  box-shadow: 0 0 30px rgba(201,168,76,0.1), inset 0 0 30px rgba(0,0,0,0.5);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 1rem;
  z-index: 10;
}

.compass-center-name {
  font-family: var(--font-h);
  font-size: clamp(0.7rem, 2vw, 0.95rem);
  color: var(--gold);
  line-height: 1.2;
  max-width: 120px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.compass-center-info {
  font-size: clamp(0.6rem, 1.5vw, 0.78rem);
  color: var(--text-dim);
  margin-top: 0.2rem;
}

.compass-center-step {
  font-size: 0.65rem;
  color: var(--text-dim);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-top: 0.4rem;
}

/* Compass Section Nodes */
.compass-section {
  position: absolute;
  width: min(80px, 15vw);
  height: min(80px, 15vw);
  border-radius: 50%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  background: radial-gradient(circle at 35% 35%, var(--surface2), var(--bg2));
  border: 1px solid var(--border2);
  z-index: 5;
  user-select: none;
}

.compass-section::before {
  content: '';
  position: absolute;
  inset: -4px;
  border-radius: 50%;
  border: 1px solid transparent;
  transition: all 0.3s;
}

.compass-section.active::before {
  border-color: var(--gold);
  box-shadow: 0 0 15px var(--gold), 0 0 30px rgba(201,168,76,0.3);
  animation: pulse 2s ease-in-out infinite;
}

.compass-section.completed::before {
  border-color: rgba(201,168,76,0.5);
}

.compass-section:hover {
  transform: scale(1.12);
  border-color: var(--gold-dim);
  box-shadow: 0 0 20px rgba(201,168,76,0.2);
  z-index: 15;
}

.compass-section:hover::before {
  border-color: var(--gold-dim);
}

.compass-section-icon {
  font-size: clamp(1.2rem, 3vw, 1.8rem);
  line-height: 1;
}

.compass-section-label {
  font-family: var(--font-h);
  font-size: clamp(0.45rem, 1.2vw, 0.62rem);
  letter-spacing: 0.05em;
  color: var(--text2);
  text-align: center;
  margin-top: 2px;
  max-width: 70px;
}

.compass-section.active .compass-section-label { color: var(--gold); }
.compass-section.completed .compass-section-icon::after {
  content: '✓';
  position: absolute;
  top: 2px; right: 2px;
  font-size: 0.5rem;
  color: var(--gold);
  background: var(--bg);
  border-radius: 50%;
  width: 12px; height: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Connector lines between center and sections */
.compass-line {
  position: absolute;
  top: 50%; left: 50%;
  height: 1px;
  background: linear-gradient(90deg, var(--gold-dim), transparent);
  transform-origin: 0 50%;
  opacity: 0.2;
  pointer-events: none;
}

/* =============================================
   SECTION PANEL (modal-style drawer)
   ============================================= */
.section-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  z-index: 50;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}
.section-overlay.open { opacity: 1; pointer-events: all; }

.section-panel {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: min(600px, 100vw);
  background: var(--surface);
  border-left: 1px solid var(--border);
  z-index: 51;
  transform: translateX(100%);
  transition: transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.section-panel.open { transform: translateX(0); }

.section-panel-header {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 1.2rem 1.5rem;
  border-bottom: 1px solid var(--border);
  background: var(--surface2);
  flex-shrink: 0;
}

.section-panel-icon { font-size: 1.8rem; }

.section-panel-title {
  font-family: var(--font-h);
  font-size: 1.2rem;
  color: var(--gold);
  flex: 1;
}

.section-panel-close {
  background: none;
  border: 1px solid var(--border2);
  color: var(--text-dim);
  cursor: pointer;
  width: 32px; height: 32px;
  border-radius: 50%;
  font-size: 1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}
.section-panel-close:hover { border-color: var(--red2); color: var(--red2); }

.section-panel-body {
  flex: 1;
  overflow-y: auto;
  padding: 1.5rem;
}

.section-panel-footer {
  padding: 1rem 1.5rem;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 0.8rem;
  justify-content: flex-end;
  flex-shrink: 0;
}

/* =============================================
   ABILITY SCORES
   ============================================= */
.ability-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1rem;
}

.ability-box {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r2);
  padding: 1rem;
  text-align: center;
  transition: all 0.2s;
  position: relative;
}

.ability-box:hover { border-color: var(--gold-dim); }

.ability-box-name {
  font-family: var(--font-h);
  font-size: 0.7rem;
  letter-spacing: 0.15em;
  color: var(--text2);
  text-transform: uppercase;
}

.ability-box-score {
  font-family: var(--font-h);
  font-size: 2.2rem;
  color: var(--white);
  line-height: 1;
  margin: 0.3rem 0;
}

.ability-box-modifier {
  font-family: var(--font-h);
  font-size: 1rem;
  color: var(--gold);
  background: var(--bg);
  width: 40px; height: 40px;
  border-radius: 50%;
  border: 1px solid var(--border2);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto;
}

.ability-box-racial {
  font-size: 0.65rem;
  color: var(--text-dim);
  position: absolute;
  top: 4px; right: 6px;
}

/* Point buy controls */
.point-buy-total {
  text-align: center;
  padding: 0.8rem;
  background: var(--bg2);
  border-radius: var(--r);
  margin-bottom: 1rem;
  font-family: var(--font-h);
}

.point-buy-total span {
  font-size: 1.4rem;
  color: var(--gold);
}

.score-control {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  margin: 0.4rem 0;
}

.score-btn {
  width: 24px; height: 24px;
  border-radius: 50%;
  background: var(--surface2);
  border: 1px solid var(--border2);
  color: var(--text);
  cursor: pointer;
  font-size: 0.9rem;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}
.score-btn:hover { background: var(--gold-dim); }
.score-btn:disabled { opacity: 0.3; cursor: not-allowed; }

/* =============================================
   SKILLS PANEL
   ============================================= */
.skills-list {
  display: grid;
  grid-template-columns: 1fr;
  gap: 0.4rem;
}

.skill-row {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.4rem 0.6rem;
  border-radius: var(--r);
  transition: background 0.15s;
  cursor: pointer;
}

.skill-row:hover { background: rgba(201,168,76,0.05); }

.skill-check {
  width: 18px; height: 18px;
  border-radius: 50%;
  border: 1px solid var(--border2);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s;
  cursor: pointer;
  font-size: 0.6rem;
  color: transparent;
}

.skill-row.proficient .skill-check {
  background: var(--gold-dim);
  border-color: var(--gold);
  color: var(--bg);
}
.skill-row.expertise .skill-check {
  background: var(--gold);
  border-color: var(--gold2);
  color: var(--bg);
}

.skill-name {
  flex: 1;
  font-size: 0.9rem;
}

.skill-ability {
  font-family: var(--font-h);
  font-size: 0.65rem;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  width: 30px;
}

.skill-bonus {
  font-family: var(--font-h);
  font-size: 0.9rem;
  color: var(--gold);
  width: 30px;
  text-align: right;
}

/* =============================================
   COMBAT PANEL
   ============================================= */
.combat-stats-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.8rem;
  margin-bottom: 1.5rem;
}

.stat-box {

  border-radius: var(--r);
  padding: 0.8rem;

}

  font-size: 1.6rem;
  color: var(--white);
}

.stat-box-label {
  font-family: var(--font-h);
  font-size: 0.6rem;
  color: var(--text-dim);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  display: block;
  margin-top: 2px;
}

.hp-tracker {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 0.8rem 1rem;
  margin-bottom: 1rem;
}

.hp-label {
  font-family: var(--font-h);
  font-size: 0.7rem;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  min-width: 60px;
}

.hp-current {
  font-family: var(--font-h);
  font-size: 1.4rem;
  color: var(--red2);
}

.hp-max { font-family: var(--font-h); color: var(--text2); }
.hp-bar-wrap { flex: 1; height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; }
.hp-bar { height: 100%; background: linear-gradient(90deg, var(--red), var(--red2)); border-radius: 3px; transition: width 0.5s; }

/* Attacks table */
.attacks-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.85rem;
}
.attacks-table th {
  font-family: var(--font-h);
  font-size: 0.65rem;
  letter-spacing: 0.1em;
  color: var(--text-dim);
  text-transform: uppercase;
  padding: 0.4rem 0.6rem;
  text-align: left;
  border-bottom: 1px solid var(--border);
}
.attacks-table td {
  padding: 0.4rem 0.6rem;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.attacks-table tr:hover td { background: rgba(201,168,76,0.04); }

/* =============================================
   EQUIPMENT PANEL
   ============================================= */
.currency-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 0.6rem;
  margin-bottom: 1.5rem;
}

.currency-item {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 0.6rem;
  text-align: center;
}

.currency-symbol {
  font-size: 0.7rem;
  color: var(--text-dim);
  display: block;
  font-family: var(--font-h);
}

.currency-input {
  width: 100%;
  text-align: center;
  font-size: 1rem;
  font-family: var(--font-h);
  color: var(--gold);
  background: transparent;
  border: none;
  outline: none;
  padding: 0;
}

.eq-item-row {

  padding: 2px;
}
.eq-item-delete {
  cursor: pointer;
  color: var(--text-dim);
  background: none;
  border: none;
  font-size: 0.85rem;
  padding: 2px 6px;
  transition: color 0.2s;
}
.eq-item-delete:hover { color: var(--red2); }

/* =============================================
   SPELLS PANEL
   ============================================= */
.spell-dc-bar {
  display: flex;
  gap: 1rem;
  margin-bottom: 1.5rem;
}

.spell-stat {
  flex: 1;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 0.8rem;
  text-align: center;
}

.spell-stat-value {
  font-family: var(--font-h);
  font-size: 1.6rem;
  color: var(--purple2);
}

.spell-slots-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.6rem;
  margin-bottom: 1.5rem;
}

.slot-box {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 0.6rem;
  text-align: center;
}

.slot-level {
  font-family: var(--font-h);
  font-size: 0.65rem;
  color: var(--text-dim);
  display: block;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

.slot-pips {
  display: flex;
  justify-content: center;
  gap: 3px;
  margin: 4px 0;
}

.slot-pip {
  width: 10px; height: 10px;
  border-radius: 50%;
  border: 1px solid var(--purple2);
  cursor: pointer;
  transition: background 0.15s;
}
.slot-pip.used { background: transparent; border-color: var(--border2); }
.slot-pip.available { background: var(--purple2); }

.spell-entry {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.4rem 0.6rem;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  font-size: 0.9rem;
  cursor: pointer;
  transition: background 0.15s;
}

.spell-entry:hover { background: rgba(106,42,154,0.1); }

.spell-prepared-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  border: 1px solid var(--purple2);
  flex-shrink: 0;
  transition: background 0.15s;
}
.spell-entry.prepared .spell-prepared-dot { background: var(--purple2); }

.spell-entry-name { flex: 1; }
.spell-entry-school {
  font-size: 0.7rem;
  color: var(--text-dim);
  font-style: italic;
}
.spell-ritual-tag {
  font-size: 0.6rem;
  background: rgba(201,168,76,0.1);
  color: var(--gold);
  border: 1px solid var(--gold-dim);
  padding: 1px 4px;
  border-radius: 3px;
}

/* =============================================
   APPEARANCE PANEL
   ============================================= */
.image-upload-zone {
  border: 2px dashed var(--border2);
  border-radius: var(--r2);
  padding: 2rem;
  text-align: center;
  cursor: pointer;
  transition: all 0.3s;
  position: relative;
  overflow: hidden;
}

.image-upload-zone:hover {
  border-color: var(--gold-dim);
  background: rgba(201,168,76,0.03);
}

.image-upload-zone.has-image {
  padding: 0;
  border-style: solid;
  border-color: var(--gold-dim);
}

.image-preview {
  width: 100%;
  max-height: 300px;
  object-fit: cover;
  border-radius: var(--r);
}

.image-upload-hint {
  font-family: var(--font-h);
  font-size: 0.8rem;
  color: var(--text-dim);
  letter-spacing: 0.1em;
}

/* =============================================
   CHARACTER LIST PAGE
   ============================================= */
.chars-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr));
  gap: 1.5rem;
  padding: 1.5rem 0;
}

.char-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r2);
  overflow: hidden;
  cursor: pointer;
  transition: all 0.3s;
  position: relative;
}

.char-card:hover {
  border-color: var(--gold-dim);
  transform: translateY(-4px);
  box-shadow: 0 12px 40px rgba(0,0,0,0.6), 0 0 20px rgba(201,168,76,0.08);
}

.char-card-image {
  height: 180px;
  background: linear-gradient(135deg, var(--surface2), var(--bg2));
  position: relative;
  overflow: hidden;
}

.char-card-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.8;
}

.char-card-placeholder {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 3rem;
  color: var(--border2);
}

.char-card-level-badge {
  position: absolute;
  top: 8px; right: 8px;
  background: rgba(0,0,0,0.8);
  border: 1px solid var(--gold-dim);
  border-radius: 50px;
  padding: 2px 8px;
  font-family: var(--font-h);
  font-size: 0.7rem;
  color: var(--gold);
}

.char-card-body { padding: 1rem; }

.char-card-name {
  font-family: var(--font-h);
  font-size: 1.1rem;
  color: var(--white);
  margin-bottom: 0.3rem;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.char-card-class {
  font-size: 0.85rem;
  color: var(--text2);
}

.char-card-meta {
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
  margin-top: 0.5rem;
}

.meta-tag {
  font-size: 0.68rem;
  font-family: var(--font-h);
  padding: 2px 8px;
  border-radius: 50px;
  border: 1px solid var(--border);
  color: var(--text-dim);
  letter-spacing: 0.05em;
}

.char-card-actions {
  display: flex;
  gap: 0.5rem;
  padding: 0.8rem 1rem;
  border-top: 1px solid var(--border);
}

/* New character card */
.char-card-new {
  border: 2px dashed var(--border2);
  background: transparent;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 300px;
  transition: all 0.3s;
}

.char-card-new:hover {
  border-color: var(--gold-dim);
  background: rgba(201,168,76,0.03);
  transform: translateY(-4px);
}

.char-card-new-icon {
  font-size: 2.5rem;
  color: var(--border2);
  transition: color 0.3s;
  margin-bottom: 0.8rem;
}
.char-card-new:hover .char-card-new-icon { color: var(--gold-dim); }

/* =============================================
   VIEW PAGE (character sheet view)
   ============================================= */
.view-header {
  position: relative;
  padding-top: 80px;
  padding-bottom: 2rem;
  overflow: hidden;
}

.view-header-bg {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center top;
  opacity: 0.15;
  filter: blur(8px);
}

.view-header-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, transparent 40%, var(--bg) 100%);
}

.view-header-content {
  position: relative;
  z-index: 1;
  display: flex;
  gap: 2rem;
  align-items: flex-end;
  padding: 0 clamp(1rem, 4vw, 2rem);
}

.view-portrait {
  width: clamp(100px, 20vw, 160px);
  height: clamp(100px, 20vw, 160px);
  border-radius: var(--r2);
  border: 2px solid var(--gold-dim);
  object-fit: cover;
  flex-shrink: 0;
  box-shadow: 0 8px 30px rgba(0,0,0,0.6);
}

.view-portrait-placeholder {
  width: clamp(100px, 20vw, 160px);
  height: clamp(100px, 20vw, 160px);
  border-radius: var(--r2);
  border: 2px solid var(--border2);
  background: var(--surface2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 3rem;
  flex-shrink: 0;
}

.view-name { font-family: var(--font-deco); color: var(--white); }
.view-class { color: var(--gold); font-family: var(--font-h); margin: 0.2rem 0; }
.view-tags { display: flex; gap: 0.5rem; flex-wrap: wrap; }

.view-body { padding: 0 clamp(1rem, 4vw, 2rem) 3rem; }

.view-section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r2);
  padding: 1.5rem;
  margin-bottom: 1.5rem;
}

.view-section-title {
  font-family: var(--font-h);
  font-size: 1rem;
  color: var(--gold);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 1rem;
  padding-bottom: 0.5rem;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

/* =============================================
   STEP INDICATOR
   ============================================= */
.step-indicator {
  display: flex;
  justify-content: center;
  gap: 0.4rem;
  padding: 0.8rem 0;
}

.step-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--border2);
  transition: all 0.3s;
}
.step-dot.active { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
.step-dot.done { background: rgba(201,168,76,0.4); }

/* =============================================
   NOTIFICATIONS / TOASTS
   ============================================= */
.toast-container {
  position: fixed;
  bottom: 1.5rem;
  right: 1.5rem;
  z-index: 999;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  pointer-events: none;
}

.toast {
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: var(--r);
  padding: 0.7rem 1.2rem;
  font-family: var(--font-h);
  font-size: 0.85rem;
  color: var(--text);
  letter-spacing: 0.05em;
  box-shadow: var(--shadow);
  animation: slideInRight 0.3s ease, fadeOut 0.4s ease 2.5s forwards;
}

.toast.success { border-color: var(--gold-dim); color: var(--gold); }
.toast.error { border-color: var(--red2); color: var(--red2); }

/* =============================================
   DIVIDERS & DECORATIONS
   ============================================= */
.deco-divider {
  display: flex;
  align-items: center;
  gap: 1rem;
  margin: 1.5rem 0;
  color: var(--text-dim);
}
.deco-divider::before,
.deco-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--border2));
}
.deco-divider::after {
  background: linear-gradient(90deg, var(--border2), transparent);
}

.section-hint {
  font-size: 0.85rem;
  color: var(--text-dim);
  font-style: italic;
  padding: 0.5rem 0;
}

/* =============================================
   SELECTION GRID (race/class/bg picker)
   ============================================= */
.picker-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(140px, 45%), 1fr));
  gap: 0.8rem;
}

.picker-item {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 0.8rem;
  cursor: pointer;
  text-align: center;
  transition: all 0.2s;
}

.picker-item:hover {
  border-color: var(--gold-dim);
  background: rgba(201,168,76,0.04);
}

.picker-item.selected {
  border-color: var(--gold);
  background: rgba(201,168,76,0.08);
  box-shadow: 0 0 15px rgba(201,168,76,0.1);
}

.picker-item-icon { font-size: 1.5rem; margin-bottom: 0.3rem; }

.picker-item-name {
  font-family: var(--font-h);
  font-size: 0.75rem;
  letter-spacing: 0.05em;
  color: var(--text);
}
.picker-item.selected .picker-item-name { color: var(--gold); }

.picker-item-desc {
  font-size: 0.7rem;
  color: var(--text-dim);
  margin-top: 0.3rem;
  line-height: 1.3;
}

/* =============================================
   SAVING THROWS
   ============================================= */
.saves-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 0.4rem;
}

.save-row {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.9rem;
  padding: 0.3rem 0.4rem;
}

.save-dot {
  width: 12px; height: 12px;
  border-radius: 50%;
  border: 1px solid var(--border2);
  flex-shrink: 0;
}
.save-row.proficient .save-dot { background: var(--gold); border-color: var(--gold); }

/* =============================================
   RESPONSIVE BREAKPOINTS
   ============================================= */

/* Tablet */
@media (max-width: 768px) {
  .section-panel { width: 100vw; border-left: none; border-top: 1px solid var(--border); }
  .section-panel.open { transform: translateX(0); }

  .ability-grid { grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
  .ability-box-score { font-size: 1.6rem; }

  .combat-stats-grid { grid-template-columns: repeat(3, 1fr); }

  .currency-grid { grid-template-columns: repeat(5, 1fr); gap: 0.3rem; }

  .spell-slots-grid { grid-template-columns: repeat(3, 1fr); }

  .picker-grid { grid-template-columns: repeat(2, 1fr); }

  .view-header-content { flex-direction: column; align-items: flex-start; gap: 1rem; }

  .saves-grid { grid-template-columns: 1fr; }
}

/* Mobile */
@media (max-width: 480px) {
  .compass-container { width: 95vw; height: 95vw; }

  .ability-grid { grid-template-columns: repeat(2, 1fr); }

  .combat-stats-grid { grid-template-columns: repeat(2, 1fr); }

  .chars-grid { grid-template-columns: 1fr; }

  .spell-slots-grid { grid-template-columns: repeat(3, 1fr); }

  .picker-grid { grid-template-columns: repeat(2, 1fr); }

  .navbar { padding: 0.6rem 1rem; }
}

/* =============================================
   ANIMATIONS
   ============================================= */

@keyframes compassSpin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

@keyframes floatY {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

@keyframes textPulse {
  0%, 100% { text-shadow: 0 0 10px var(--gold), 0 0 30px rgba(201,168,76,0.4); }
  50% { text-shadow: 0 0 15px var(--gold), 0 0 50px rgba(201,168,76,0.5), 0 0 80px rgba(201,168,76,0.15); }
}

@keyframes pulse {
  0%, 100% { box-shadow: 0 0 10px var(--gold), 0 0 20px rgba(201,168,76,0.3); }
  50% { box-shadow: 0 0 20px var(--gold), 0 0 40px rgba(201,168,76,0.5); }
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes slideInRight {
  from { opacity: 0; transform: translateX(40px); }
  to { opacity: 1; transform: translateX(0); }
}

@keyframes fadeOut {
  to { opacity: 0; }
}

@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}

.animate-in { animation: fadeIn 0.4s ease forwards; }

/* Rune decoration */
.rune-border {
  border: 1px solid var(--gold-dim);
  position: relative;
}
.rune-border::after {
  content: '✦';
  position: absolute;
  top: -8px; left: 50%;
  transform: translateX(-50%);
  background: var(--bg);
  padding: 0 4px;
  color: var(--gold-dim);
  font-size: 0.8rem;
}

/* Gold shimmer on titles */
.shimmer {
  background: linear-gradient(90deg, var(--gold) 0%, var(--gold2) 50%, var(--gold) 100%);
  background-size: 200% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: shimmer 3s linear infinite;
}

/* Loading spinner */
.spinner {
  width: 30px; height: 30px;
  border: 2px solid var(--border2);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: compassSpin 0.8s linear infinite;
  margin: 2rem auto;
}

/* Inert when section not yet unlocked */
.compass-section.locked {
  opacity: 0.4;
  cursor: not-allowed;
  pointer-events: none;
}

/* Custom powers / features */
.feature-entry {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 0.8rem;
  margin-bottom: 0.6rem;
}

.feature-entry-name {
  font-family: var(--font-h);
  font-size: 0.9rem;
  color: var(--gold);
  margin-bottom: 0.3rem;
}

.feature-entry-desc {
  font-size: 0.85rem;
  color: var(--text2);
  line-height: 1.5;
}

/* =============================================
   PRINT STYLES
   ============================================= */
@media print {
  body { background: white; color: black; }
  .navbar, #particles-canvas, .btn, .section-panel { display: none; }
  .view-header-bg { opacity: 0.05; }
  .card, .view-section { border: 1px solid #ccc; }
}

// ============ STORAGE ============
// User & Character Storage (localStorage-based, multi-user)

const Storage = {
  KEYS: {
    currentUser: 'dnd_current_user',
    users: 'dnd_users',
    characters: (user) => `dnd_characters_${user}`
  },

  getCurrentUser() {
    return localStorage.getItem(this.KEYS.currentUser);
  },

  setCurrentUser(username) {
    if (!username) return false;
    const clean = username.trim().toLowerCase().replace(/[^a-z0-9_\-àèìòù]/gi, '');
    if (!clean) return false;
    localStorage.setItem(this.KEYS.currentUser, clean);
    const users = this.getUsers();
    if (!users.includes(clean)) {
      users.push(clean);
      localStorage.setItem(this.KEYS.users, JSON.stringify(users));
    }
    return clean;
  },

  getUsers() {
    try {
      return JSON.parse(localStorage.getItem(this.KEYS.users) || '[]');
    } catch { return []; }
  },

  logout() {
    localStorage.removeItem(this.KEYS.currentUser);
  },

  getCharacters(user) {
    const u = user || this.getCurrentUser();
    if (!u) return [];
    try {
      return JSON.parse(localStorage.getItem(this.KEYS.characters(u)) || '[]');
    } catch { return []; }
  },

  saveCharacter(character, user) {
    const u = user || this.getCurrentUser();
    if (!u) return false;
    const chars = this.getCharacters(u);
    const idx = chars.findIndex(c => c.id === character.id);
    if (idx >= 0) {
      chars[idx] = { ...character, updatedAt: new Date().toISOString() };
    } else {
      chars.push({
        ...character,
        id: character.id || this.generateId(),
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      });
    }
    localStorage.setItem(this.KEYS.characters(u), JSON.stringify(chars));
    return true;
  },

  getCharacter(id, user) {
    const chars = this.getCharacters(user);
    return chars.find(c => c.id === id) || null;
  },

  deleteCharacter(id, user) {
    const u = user || this.getCurrentUser();
    if (!u) return false;
    const chars = this.getCharacters(u).filter(c => c.id !== id);
    localStorage.setItem(this.KEYS.characters(u), JSON.stringify(chars));
    return true;
  },

  generateId() {
    return 'char_' + Date.now() + '_' + Math.random().toString(36).slice(2, 9);
  },

  newCharacter() {
    return {
      id: this.generateId(),
      identity: {
        name: '', race: '', subrace: '', class: '', subclass: '',
        level: 1, background: '', alignment: '', xp: 0,
        deity: '', age: '', height: '', weight: '', eyes: '', hair: '', skin: ''

// ============ CALC ============
// D&D 5e Calculations Engine

const Calc = {
  modifier(score) {
    return Math.floor((score - 10) / 2);
  },

  modStr(score) {
    const m = this.modifier(score);
    return (m >= 0 ? '+' : '') + m;
  },

  proficiencyBonus(level) {
    return DND.PROFICIENCY_BONUS[Math.max(1, Math.min(20, level))] || 2;
  },

  maxHP(character) {
    const cls = DND.CLASSES[character.identity.class];
    if (!cls) return 0;
    const hd = cls.hit_die;
    const conMod = this.modifier(character.abilities.con);
    const lvl = character.identity.level || 1;
    const level1HP = hd + conMod;
    const perLevel = Math.floor(hd / 2) + 1 + conMod;
    return Math.max(1, level1HP + (lvl - 1) * perLevel);
  },

  ac(character) {
    if (character.combat.custom_ac) return character.combat.custom_ac;
    const cls = DND.CLASSES[character.identity.class];
    const dexMod = this.modifier(character.abilities.dex);
    const conMod = this.modifier(character.abilities.con);
    const wisMod = this.modifier(character.abilities.wis);

    if (character.combat.armor_type === '') {
      const unarmoredDefense = cls ? cls.unarmored_defense : null;
      if (unarmoredDefense === '10 + DEX + CON') return 10 + dexMod + conMod;
      if (unarmoredDefense === '10 + DEX + WIS') return 10 + dexMod + wisMod;
      return 10 + dexMod;
    }

    const armorAC = character.combat.armor_ac || 10;
    const armorData = this.findArmor(character.combat.armor_type);
    let ac = armorAC;

    if (armorData) {
      if (armorData.category === 'light') ac = armorData.ac + dexMod;
      else if (armorData.category === 'medium') ac = armorData.ac + Math.min(dexMod, 2);
      else ac = armorData.ac;
    }

    if (character.combat.shield) ac += 2;
    return ac;
  },

  findArmor(name) {
    for (const [cat, list] of Object.entries(DND.ARMOR)) {
      const found = list.find(a => a.name === name);
      if (found) return { ...found, category: cat };
    }
    return null;
  },

  initiative(character) {
    return this.modifier(character.abilities.dex) + (character.combat.initiative_bonus || 0);
  },

  savingThrow(character, ability) {
    const base = this.modifier(character.abilities[ability]);
    const prof = character.saving_throw_proficiencies || [];
    const hasProficiency = prof.includes(ability);
    const pb = this.proficiencyBonus(character.identity.level);
    return base + (hasProficiency ? pb : 0);
  },

  skillBonus(character, skillName) {
    const skill = DND.SKILLS.find(s => s.name === skillName);
    if (!skill) return 0;
    const base = this.modifier(character.abilities[skill.ability]);
    const pb = this.proficiencyBonus(character.identity.level);
    const prof = character.skill_proficiencies || [];
    const expertise = character.skills || {};
    if (expertise[skillName] === 'expertise') return base + pb * 2;
    if (prof.includes(skillName)) return base + pb;
    return base;
  },

  passivePerception(character) {
    return 10 + this.skillBonus(character, 'Percezione');
  },

  spellSaveDC(character) {
    const cls = DND.CLASSES[character.identity.class];
    if (!cls || !cls.spellcasting) return 0;
    const ability = cls.spellcasting.ability;
    const pb = this.proficiencyBonus(character.identity.level);
    return 8 + pb + this.modifier(character.abilities[ability]);
  },

  spellAttackBonus(character) {
    const cls = DND.CLASSES[character.identity.class];
    if (!cls || !cls.spellcasting) return 0;
    const ability = cls.spellcasting.ability;
    const pb = this.proficiencyBonus(character.identity.level);
    return pb + this.modifier(character.abilities[ability]);
  },

  isSpellcaster(character) {
    const cls = DND.CLASSES[character.identity.class];
    return !!(cls && cls.spellcasting);
  },

  spellSlots(character) {
    const cls = DND.CLASSES[character.identity.class];
    if (!cls || !cls.spellcasting) return null;
    const lvl = character.identity.level || 1;
    if (character.identity.class === 'Warlock') {
      return DND.WARLOCK_SPELL_SLOTS[lvl];
    }
    return DND.SPELL_SLOTS[lvl];
  },

  getClassSpells(className) {
    const spells = {};
    for (const [level, list] of Object.entries(DND.SPELLS)) {
      spells[level] = list.filter(s => s.classes.includes(className));
    }
    return spells;
  },

  abilityScoreImprovements(level) {
    const improvements = [4, 8, 12, 16, 19];
    return improvements.filter(l => l <= level).length;
  },

  autoCalculate(character) {
    const level = character.identity.level || 1;
    character.proficiency_bonus = this.proficiencyBonus(level);

    if (character.identity.class) {
      const cls = DND.CLASSES[character.identity.class];
      if (cls) {
        if (!character.combat.max_hp) {
          character.combat.max_hp = this.maxHP(character);
          if (!character.combat.current_hp) {
            character.combat.current_hp = character.combat.max_hp;
          }
        }
        character.combat.ac_calculated = this.ac(character);
        character.combat.initiative_calculated = this.initiative(character);

        if (!character.saving_throw_proficiencies || character.saving_throw_proficiencies.length === 0) {
          character.saving_throw_proficiencies = [...cls.saving_throws];
        }
      }
    }

    if (character.identity.race) {
      const race = DND.RACES[character.identity.race];
      if (race) {
        if (!character.combat.speed) character.combat.speed = race.speed || 30;
        if (!character.languages || character.languages.length === 0) {
          character.languages = [...(race.languages || ['Comune'])];
        }
      }
    }

    if (character.identity.class && character.identity.background) {
      const bg = DND.BACKGROUNDS[character.identity.background];
      const cls = DND.CLASSES[character.identity.class];
      const merged = new Set([
        ...(character.skill_proficiencies || []),
        ...(bg ? bg.skill_proficiencies : []),
        ...(cls ? (cls.skill_choices?.from === 'any' ? [] : []) : [])
      ]);
      character.skill_proficiencies = [...merged];
    }

    if (this.isSpellcaster(character)) {
      character.spells.spell_save_dc = this.spellSaveDC(character);
      character.spells.spell_attack_bonus = this.spellAttackBonus(character);
    }

    return character;
  },

  getPointBuyCost(scores) {
    return Object.values(scores).reduce((total, score) => {
      return total + (DND.POINT_BUY_COSTS[score] || 0);
    }, 0);
  },

  getHitDie(className) {
    return DND.CLASSES[className]?.hit_die || 8;
  },

  getRacialBonuses(raceName, subraceName) {
    const race = DND.RACES[raceName];
    if (!race) return {};
    let bonuses = { ...(race.ability_bonus || {}) };
    if (subraceName && race.subraces?.[subraceName]) {
      const sub = race.subraces[subraceName];
      for (const [k, v] of Object.entries(sub.ability_bonus || {})) {
        bonuses[k] = (bonuses[k] || 0) + v;
      }
    }
    return bonuses;
  },

  applyRacialBonuses(baseScores, raceName, subraceName) {
    const bonuses = this.getRacialBonuses(raceName, subraceName);
    const result = { ...baseScores };
    for (const [ability, bonus] of Object.entries(bonuses)) {
      if (ability !== 'two_of_choice' && result[ability] !== undefined) {
        result[ability] += bonus;
      }
    }
    return result;
  }
};

// Particles background
function initParticles(canvasId) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  let W, H, particles = [];

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  function mkParticle() {
    return {
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.5 + 0.3,
      vx: (Math.random() - 0.5) * 0.12,
      vy: (Math.random() - 0.5) * 0.12,
      alpha: Math.random() * 0.6 + 0.1,
      pulse: Math.random() * Math.PI * 2
    };
  }

  for (let i = 0; i < 120; i++) particles.push(mkParticle());

  function draw() {
    ctx.clearRect(0, 0, W, H);
    particles.forEach(p => {
      p.pulse += 0.015;
      const a = p.alpha * (0.7 + 0.3 * Math.sin(p.pulse));
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(201,168,76,${a})`;
      ctx.fill();
      p.x += p.vx;
      p.y += p.vy;
      if (p.x < 0) p.x = W;
      if (p.x > W) p.x = 0;
      if (p.y < 0) p.y = H;
      if (p.y > H) p.y = 0;
    });
    requestAnimationFrame(draw);
  }
  draw();
}

function initIndexPage() {
  initParticles('particles-canvas');

  const currentUser = Storage.getCurrentUser();
  const loginCard = document.getElementById('login-card');
  const welcomeCard = document.getElementById('welcome-card');

  if (currentUser) {
    showWelcome(currentUser);
  } else {
    showLogin();
  }

  // User login form
  const loginForm = document.getElementById('login-form');
  if (loginForm) {
    loginForm.addEventListener('submit', e => {
      e.preventDefault();
      const input = document.getElementById('username-input');
      const username = Storage.setCurrentUser(input.value);
      if (username) {
        showWelcome(username);
      } else {
        showToast('Inserisci un nome valido', 'error');
      }
    });
  }

  // Existing users list
  renderUserList();

  function showLogin() {
    if (loginCard) loginCard.style.display = '';
    if (welcomeCard) welcomeCard.style.display = 'none';
  }

  function showWelcome(user) {
    if (loginCard) loginCard.style.display = 'none';
    if (welcomeCard) {
      welcomeCard.style.display = '';
      const nameEl = document.getElementById('welcome-name');
      if (nameEl) nameEl.textContent = user;
      const chars = Storage.getCharacters(user);
      const countEl = document.getElementById('char-count');
      if (countEl) countEl.textContent = chars.length;
    }
  }

  function renderUserList() {
    const ul = document.getElementById('users-list');
    if (!ul) return;
    const users = Storage.getUsers();
    if (users.length === 0) {
      ul.style.display = 'none';
      return;
    }
    ul.innerHTML = '';
    users.forEach(u => {
      const chip = document.createElement('div');
      chip.className = 'user-chip';
      chip.innerHTML = `<span class="user-chip-icon">⚔</span> ${u}`;
      chip.addEventListener('click', () => {
        Storage.setCurrentUser(u);
        showWelcome(u);
      });
      ul.appendChild(chip);
    });
  }

  // Logout
  const logoutBtns = document.querySelectorAll('.btn-logout');
  logoutBtns.forEach(b => b.addEventListener('click', () => {
    Storage.logout();
    showLogin();
    renderUserList();
  }));

function initCreatePage() {
  initParticles('particles-canvas');

  const user = Storage.getCurrentUser();
  if (!user) { location.hash='index'; return; }

  const usernameEl = document.getElementById('nav-username');
  if (usernameEl) usernameEl.textContent = user;

  document.querySelectorAll('.btn-logout').forEach(b => b.addEventListener('click', () => {
    Storage.logout(); location.hash='index';
  }));

  // Load existing or new character
  const charId = getParam('id');
  let character = charId ? Storage.getCharacter(charId, user) : null;
  if (!character) character = Storage.newCharacter();

  // Section definitions
  const SECTIONS = [
    { key: 'identity',   icon: '⚜',  label: 'Identità',       step: 1 },
    { key: 'abilities',  icon: '💪',  label: 'Caratteristiche', step: 2 },
    { key: 'skills',     icon: '🎯',  label: 'Abilità',         step: 3 },
    { key: 'combat',     icon: '⚔',   label: 'Combattimento',   step: 4 },
    { key: 'equipment',  icon: '🎒',  label: 'Equipaggiamento', step: 5 },
    { key: 'spells',     icon: '✨',  label: 'Magie',           step: 6 },
    { key: 'story',      icon: '📖',  label: 'Storia',          step: 7 },
    { key: 'appearance', icon: '🖼',  label: 'Aspetto',         step: 8 }
  ];

  buildCompass(SECTIONS);
  updateCompassCenter();

  let currentSection = null;
  let completedSections = new Set(loadCompletedSections());

  function loadCompletedSections() {
    if (character.identity.name) return ['identity'];
    return [];
  }

  // Build the compass
  function buildCompass(sections) {
    const container = document.getElementById('compass-container');
    if (!container) return;

    const size = container.offsetWidth;
    const cx = size / 2;
    const cy = size / 2;
    const r = size * 0.38;
    const nodeSize = size * 0.14;

    // Draw connector lines
    sections.forEach((sec, i) => {
      const angle = (i * (360 / sections.length) - 90) * Math.PI / 180;
      const x = cx + r * Math.cos(angle);
      const y = cy + r * Math.sin(angle);
      const lineLen = r - nodeSize / 2 - size * 0.14;
      const lineAngle = Math.atan2(y - cy, x - cx) * 180 / Math.PI;

      const line = document.createElement('div');
      line.className = 'compass-line';
      line.style.cssText = `
        width: ${lineLen}px;
        transform: translate(${cx}px, ${cy}px) rotate(${lineAngle}deg);
        top: 0; left: 0;
      `;
      container.appendChild(line);
    });

    // Create section nodes
    sections.forEach((sec, i) => {
      const angle = (i * (360 / sections.length) - 90) * Math.PI / 180;
      const x = cx + r * Math.cos(angle);
      const y = cy + r * Math.sin(angle);

      const node = document.createElement('div');
      node.className = 'compass-section';
      node.id = `section-${sec.key}`;
      node.dataset.key = sec.key;
      node.style.cssText = `
        left: ${x - nodeSize / 2}px;
        top: ${y - nodeSize / 2}px;
        width: ${nodeSize}px;
        height: ${nodeSize}px;
      `;
      node.innerHTML = `
        <span class="compass-section-icon">${sec.icon}</span>
        <span class="compass-section-label">${sec.label}</span>
      `;

      node.addEventListener('click', () => openSection(sec.key));
      container.appendChild(node);
    });

    updateSectionStates();
  }

  function updateSectionStates() {
    SECTIONS.forEach(sec => {
      const node = document.getElementById(`section-${sec.key}`);
      if (!node) return;
      node.classList.remove('active', 'completed');
      if (currentSection === sec.key) node.classList.add('active');
      else if (isSectionComplete(sec.key)) node.classList.add('completed');
    });
  }

  function isSectionComplete(key) {
    switch (key) {
      case 'identity':   return !!character.identity.name && !!character.identity.race && !!character.identity.class;
      case 'abilities':  return Object.values(character.abilities).some(v => v !== 10);
      case 'skills':     return character.skill_proficiencies.length > 0;
      case 'combat':     return character.combat.max_hp > 0;
      case 'equipment':  return character.equipment.items.length > 0;
      case 'spells':     return !Calc.isSpellcaster(character) || character.spells.known.length > 0 || character.spells.prepared.length > 0;
      case 'story':      return !!character.story.backstory || !!character.story.traits;
      case 'appearance': return !!character.appearance.description || !!character.appearance.image;
      default:           return false;
    }
  }

  function updateCompassCenter() {
    const nameEl = document.getElementById('center-name');
    const infoEl = document.getElementById('center-info');
    const stepEl = document.getElementById('center-step');
    if (nameEl) nameEl.textContent = character.identity.name || 'Il tuo eroe';
    if (infoEl) {
      const parts = [character.identity.class, character.identity.race].filter(Boolean);
      infoEl.textContent = parts.length ? parts.join(' · ') : 'Clicca una sezione';
    }
    if (stepEl) {
      const done = SECTIONS.filter(s => isSectionComplete(s.key)).length;
      stepEl.textContent = `${done} / ${SECTIONS.length} sezioni`;
    }
  }

  // ---- OPEN SECTION PANEL ----
  function openSection(key) {
    currentSection = key;
    const overlay = document.getElementById('section-overlay');
    const panel = document.getElementById('section-panel');
    const sec = SECTIONS.find(s => s.key === key);

    document.getElementById('panel-icon').textContent = sec.icon;
    document.getElementById('panel-title').textContent = sec.label;
    document.getElementById('panel-body').innerHTML = '';

    overlay.classList.add('open');
    panel.classList.add('open');

    updateSectionStates();
    renderSectionContent(key, document.getElementById('panel-body'));
  }

  function closeSection() {
    currentSection = null;
    document.getElementById('section-overlay').classList.remove('open');
    document.getElementById('section-panel').classList.remove('open');
    updateSectionStates();
    updateCompassCenter();
    autoSave();
  }

  document.getElementById('panel-close')?.addEventListener('click', closeSection);
  document.getElementById('section-overlay')?.addEventListener('click', closeSection);

  // ---- AUTO SAVE ----
  let saveTimer;
  function autoSave() {
    clearTimeout(saveTimer);

      Calc.autoCalculate(character);
      Storage.saveCharacter(character, user);
      showToast('Salvato ✦', 'success');

  // =============================================
  // SECTION RENDERERS
  // =============================================

      case 'identity':   renderIdentity(container); break;
      case 'abilities':  renderAbilities(container); break;
      case 'skills':     renderSkills(container); break;
      case 'combat':     renderCombat(container); break;
      case 'equipment':  renderEquipment(container); break;
      case 'spells':     renderSpells(container); break;

          document.getElementById('subclass-wrap').style.display = '';
        } else {
          document.getElementById('subclass-wrap').style.display = 'none';
        }
        Calc.autoCalculate(character);
        autoSave();
      });
      p.appendChild(item);
    });

    if (character.identity.class && character.identity.level >= 3) {
      const cls = DND.CLASSES[character.identity.class];
      if (cls?.subclasses) {
        buildSubclassPicker(cls.subclasses);
        document.getElementById('subclass-wrap').style.display = '';
      }
    }
    if (character.identity.race && DND.RACES[character.identity.race]?.subraces) {
      buildSubracePicker(character.identity.race, DND.RACES[character.identity.race].subraces);
      document.getElementById('subrace-wrap').style.display = '';
    }
  }

  function buildSubclassPicker(subclassData) {
    const p = document.getElementById('subclass-picker');
    if (!p) return;
    p.innerHTML = '';
    subclassData.choices.forEach(name => {
      const item = document.createElement('div');
      item.className = `picker-item${character.identity.subclass === name ? ' selected' : ''}`;
      item.innerHTML = `<div class="picker-item-name">${name}</div>`;
      item.addEventListener('click', () => {
        character.identity.subclass = name;
        p.querySelectorAll('.picker-item').forEach(x => x.classList.remove('selected'));
        item.classList.add('selected');
        autoSave();
      });
      p.appendChild(item);
    });
  }

  function buildBgPicker() {
    const p = document.getElementById('bg-picker');
    if (!p) return;
    Object.entries(DND.BACKGROUNDS).forEach(([name, data]) => {
      const item = document.createElement('div');
      item.className = `picker-item${character.identity.background === name ? ' selected' : ''}`;
      item.innerHTML = `
        <div class="picker-item-icon">${BG_ICONS[name] || '📜'}</div>
        <div class="picker-item-name">${name}</div>
        <div class="picker-item-desc">${data.skill_proficiencies.join(', ')}</div>
      `;
      item.addEventListener('click', () => {
        character.identity.background = name;
        // Add background skill proficiencies
        data.skill_proficiencies.forEach(skill => {
          if (!character.skill_proficiencies.includes(skill)) {
            character.skill_proficiencies.push(skill);
          }
        });
        p.querySelectorAll('.picker-item').forEach(x => x.classList.remove('selected'));
        item.classList.add('selected');
        autoSave();
      });
      p.appendChild(item);
    });
  }

  // ---- ABILITIES ----
  function renderAbilities(c) {
    const raceBonuses = Calc.getRacialBonuses(character.identity.race, character.identity.subrace);
    const abilities = ['str', 'dex', 'con', 'int', 'wis', 'cha'];
    const pointBuyCosts = DND.POINT_BUY_COSTS;

    let method = character._abilityMethod || 'manual';

    c.innerHTML = `
      <div style="display:flex;gap:0.5rem;margin-bottom:1.2rem;flex-wrap:wrap">
        <button class="btn btn-sm ${method==='manual'?'btn-primary':'btn-secondary'}" data-method="manual">Manuale</button>
        <button class="btn btn-sm ${method==='pointbuy'?'btn-primary':'btn-secondary'}" data-method="pointbuy">Point Buy (27pt)</button>
        <button class="btn btn-sm ${method==='standard'?'btn-primary':'btn-secondary'}" data-method="standard">Array Standard</button>
      </div>
      <div id="method-info"></div>
      <div class="ability-grid" id="ability-grid"></div>
      <div style="margin-top:1rem;padding:0.8rem;background:var(--bg2);border-radius:var(--r);font-size:0.8rem;color:var(--text-dim)">
        ${raceBonuses && Object.keys(raceBonuses).length ?
          `<strong style="color:var(--gold)">Bonus Razziali:</strong> ${
            Object.entries(raceBonuses)
              .filter(([k]) => k !== 'two_of_choice')
              .map(([k,v]) => `${DND.ABILITY_NAMES[k]} +${v}`)
              .join(', ') || '—'
          }` : '<em>Seleziona una razza per vedere i bonus razziali</em>'}
      </div>
    `;

    c.querySelectorAll('[data-method]').forEach(btn => {
      btn.addEventListener('click', () => {
        method = btn.dataset.method;
        character._abilityMethod = method;
        if (method === 'standard') {
          const arr = [...DND.STANDARD_ARRAY];
          abilities.forEach((ab, i) => character.abilities[ab] = arr[i]);
        }
        renderAbilityGrid();
        c.querySelectorAll('[data-method]').forEach(b => {
          b.className = `btn btn-sm ${b.dataset.method === method ? 'btn-primary' : 'btn-secondary'}`;
        });
      });
    });

    function renderAbilityGrid() {
      const grid = document.getElementById('ability-grid');
      if (!grid) return;
      const pointsLeft = 27 - Calc.getPointBuyCost(character.abilities);

      const infoEl = document.getElementById('method-info');
      if (method === 'pointbuy' && infoEl) {
        infoEl.innerHTML = `
          <div class="point-buy-total">Punti rimasti: <span style="color:${pointsLeft<0?'var(--red2)':'var(--gold)'}">${pointsLeft}</span> / 27</div>
        `;
      } else if (method === 'standard' && infoEl) {
        infoEl.innerHTML = `<div class="section-hint">Array standard: 15, 14, 13, 12, 10, 8 assegnati in ordine.</div>`;
      } else if (infoEl) {
        infoEl.innerHTML = '';
      }

      grid.innerHTML = '';
      abilities.forEach(ab => {
        const base = character.abilities[ab];
        const bonus = raceBonuses[ab] || 0;
        const total = base + bonus;
        const mod = Calc.modifier(total);

        const box = document.createElement('div');
        box.className = 'ability-box';
        box.innerHTML = `
          <div class="ability-box-name">${DND.ABILITY_NAMES[ab]}</div>
          ${bonus ? `<div class="ability-box-racial">+${bonus} razza</div>` : ''}
          <div class="score-control">
            ${method === 'pointbuy' ? `<button class="score-btn" data-ab="${ab}" data-d="-1">−</button>` : ''}
            <input class="ability-input" type="number" value="${base}" min="3" max="20" data-ab="${ab}" ${method==='standard'?'readonly':''}>
            ${method === 'pointbuy' ? `<button class="score-btn" data-ab="${ab}" data-d="1">+</button>` : ''}
          </div>
          ${bonus ? `<div style="font-size:0.7rem;color:var(--text-dim);margin:2px 0">(totale: ${total})</div>` : ''}
          <div class="ability-box-modifier">${Calc.modStr(total)}</div>
        `;

        box.querySelectorAll('input').forEach(inp => {
          inp.addEventListener('change', () => {
            const val = parseInt(inp.value) || 10;
            character.abilities[ab] = Math.max(3, Math.min(20, val));
            renderAbilityGrid();
            autoSave();
          });
        });

        box.querySelectorAll('.score-btn').forEach(btn => {
          const delta = parseInt(btn.dataset.d);
          btn.addEventListener('click', () => {
            const newVal = character.abilities[ab] + delta;
            if (newVal < 8 || newVal > 15) return;
            const newCost = Calc.getPointBuyCost({ ...character.abilities, [ab]: newVal });
            if (delta > 0 && newCost > 27) return;
            character.abilities[ab] = newVal;
            renderAbilityGrid();
            autoSave();
          });
        });

        grid.appendChild(box);
      });
    }

    renderAbilityGrid();
  }

  // ---- SKILLS ----
  function renderSkills(c) {
    const cls = DND.CLASSES[character.identity.class];
    const maxChoices = cls?.skill_choices?.count || 2;
    const available = cls?.skill_choices?.from === 'any'
      ? DND.SKILLS.map(s => s.name)
      : (cls?.skill_choices?.from || []);

    const bgSkills = character.identity.background
      ? (DND.BACKGROUNDS[character.identity.background]?.skill_proficiencies || [])
      : [];

    c.innerHTML = `
      <div style="font-size:0.85rem;color:var(--text-dim);margin-bottom:1rem">
        Puoi scegliere <strong style="color:var(--gold)">${maxChoices}</strong> competenze dalla tua classe.
        Il background aggiunge: <strong style="color:var(--gold)">${bgSkills.join(', ') || '—'}</strong>
      </div>
      <div id="class-skill-picks" style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:0.8rem;margin-bottom:1rem">
        <div style="font-family:var(--font-h);font-size:0.75rem;color:var(--text2);margin-bottom:0.6rem;letter-spacing:0.1em">
          SCEGLI LE COMPETENZE DI CLASSE
        </div>
        <div id="class-skill-grid" class="picker-grid" style="grid-template-columns:repeat(auto-fill,minmax(130px,1fr))"></div>
      </div>
      <div class="skills-list" id="all-skills-list"></div>
    `;

    const classPickedSkills = character.skill_proficiencies.filter(s =>
      !bgSkills.includes(s) && available.includes(s)
    );

    function renderClassSkillPicks() {
      const grid = document.getElementById('class-skill-grid');
      if (!grid) return;
      grid.innerHTML = '';
      available.forEach(skillName => {
        const isPicked = classPickedSkills.includes(skillName);
        const item = document.createElement('div');
        item.className = `picker-item${isPicked ? ' selected' : ''}`;
        item.style.cssText = 'padding:0.5rem;text-align:center';
        item.innerHTML = `<div class="picker-item-name" style="font-size:0.75rem">${skillName}</div>`;
        item.addEventListener('click', () => {
          if (isPicked) {
            const idx = classPickedSkills.indexOf(skillName);
            classPickedSkills.splice(idx, 1);
            character.skill_proficiencies = character.skill_proficiencies.filter(s => s !== skillName || bgSkills.includes(s));
          } else {
            if (classPickedSkills.length >= maxChoices) {
              showToast(`Puoi scegliere solo ${maxChoices} competenze`, 'error');
              return;
            }
            classPickedSkills.push(skillName);
            if (!character.skill_proficiencies.includes(skillName)) {
              character.skill_proficiencies.push(skillName);
            }
          }
          renderClassSkillPicks();
          renderAllSkills();
          autoSave();
        });
        grid.appendChild(item);
      });
    }

    function renderAllSkills() {
      const list = document.getElementById('all-skills-list');
      if (!list) return;
      list.innerHTML = '';
      DND.SKILLS.forEach(skill => {
        const isProficient = character.skill_proficiencies.includes(skill.name);
        const isExpertise = character.skills?.[skill.name] === 'expertise';
        const bonus = Calc.skillBonus(character, skill.name);

        const row = document.createElement('div');
        row.className = `skill-row${isProficient ? (isExpertise ? ' expertise' : ' proficient') : ''}`;
        row.innerHTML = `
          <div class="skill-check" title="${isProficient ? (isExpertise ? 'Doppia competenza — clicca per rimuovere' : 'Competente — clicca per doppia') : 'Non competente — clicca per aggiungere'}">${isExpertise ? '◆' : (isProficient ? '✓' : '')}</div>
          <span class="skill-ability">${skill.ability.toUpperCase()}</span>
          <span class="skill-name">${skill.name}</span>
          <span class="skill-bonus">${bonus >= 0 ? '+' : ''}${bonus}</span>
        `;

        row.querySelector('.skill-check').addEventListener('click', () => {
          if (!isProficient) {
            character.skill_proficiencies.push(skill.name);
          } else if (!isExpertise) {
            if (!character.skills) character.skills = {};
            character.skills[skill.name] = 'expertise';
          } else {
            character.skill_proficiencies = character.skill_proficiencies.filter(s => s !== skill.name);
            if (character.skills) delete character.skills[skill.name];
          }
          renderClassSkillPicks();
          renderAllSkills();
          autoSave();
        });
        list.appendChild(row);
      });
    }

    renderClassSkillPicks();
    renderAllSkills();
  }

        <span class="hp-max"> / ${character.combat.max_hp || maxHP}</span>
        <div class="hp-bar-wrap">
          <div class="hp-bar" id="hp-bar" style="width:${Math.min(100, ((character.combat.current_hp || maxHP) / (character.combat.max_hp || maxHP)) * 100)}%"></div>
        </div>
        <input type="number" style="width:60px;text-align:center;font-family:var(--font-h);color:var(--blue2);background:transparent;border:none;outline:none"
          id="f-max-hp" value="${character.combat.max_hp || maxHP}" min="1" title="PF Massimi">
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.8rem;margin-bottom:1rem">
        <div class="form-group">
          <label>Tipo Armatura</label>
          <select id="f-armor">
            <option value="">Senza Armatura</option>
            ${Object.entries(DND.ARMOR).flatMap(([cat, list]) =>
              list.map(a => `<option value="${a.name}" ${character.combat.armor_type === a.name ? 'selected' : ''}>${a.name} (CA ${a.ac})</option>`)
            ).join('')}
          </select>
        </div>
        <div class="form-group">
          <label>Scudo</label>
          <select id="f-shield">
            <option value="0" ${!character.combat.shield ? 'selected' : ''}>No</option>
            <option value="1" ${character.combat.shield ? 'selected' : ''}>Sì (+2 CA)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Velocità Personalizzata (ft)</label>
          <input type="number" id="f-speed" value="${character.combat.speed || 30}" min="0" max="120">
        </div>
        <div class="form-group">
          <label>Bonus Iniziativa Aggiuntivo</label>
          <input type="number" id="f-init-bonus" value="${character.combat.initiative_bonus || 0}">
        </div>

      <div class="saves-grid">
        ${Object.entries(DND.ABILITY_NAMES).map(([ab, name]) => {
          const prof = character.saving_throw_proficiencies.includes(ab);
          const bonus = Calc.savingThrow(character, ab);
          return `
            <div class="save-row${prof ? ' proficient' : ''}" data-ab="${ab}" style="cursor:pointer" title="Clicca per aggiungere/rimuovere competenza">
              <div class="save-dot"></div>
              <span style="min-width:90px">${name}</span>
              <span style="font-family:var(--font-h);color:var(--gold);margin-left:auto">${bonus >= 0 ? '+' : ''}${bonus}</span>
            </div>
          `;
        }).join('')}

      <table class="attacks-table" id="attacks-table">

          <option value="">— Aggiungi arma —</option>
          ${[...DND.WEAPONS.simple_melee, ...DND.WEAPONS.simple_ranged, ...DND.WEAPONS.martial_melee, ...DND.WEAPONS.martial_ranged]
            .map(w => `<option value="${w.name}">${w.name} (${w.damage} ${w.type})</option>`).join('')}
        </select>
        <button class="btn btn-secondary btn-sm" id="add-weapon-btn">Aggiungi</button>

      character.combat.current_hp = parseInt(e.target.value) || 0;
      const maxHPVal = character.combat.max_hp || maxHP;
      const pct = Math.min(100, Math.max(0, (character.combat.current_hp / maxHPVal) * 100));
      document.getElementById('hp-bar').style.width = pct + '%';
      autoSave();
    });

    document.getElementById('f-max-hp')?.addEventListener('change', e => {
      character.combat.max_hp = parseInt(e.target.value) || 1;
      autoSave();
    });

    document.getElementById('f-armor')?.addEventListener('change', e => {
      character.combat.armor_type = e.target.value;
      const found = Calc.findArmor(e.target.value);
      if (found) character.combat.armor_ac = found.ac;
      character.combat.ac_calculated = Calc.ac(character);
      autoSave();
    });

    document.getElementById('f-shield')?.addEventListener('change', e => {
      character.combat.shield = e.target.value === '1';
      autoSave();
    });

    document.getElementById('f-speed')?.addEventListener('change', e => {
      character.combat.speed = parseInt(e.target.value) || 30;
      autoSave();
    });

    document.getElementById('f-init-bonus')?.addEventListener('change', e => {
      character.combat.initiative_bonus = parseInt(e.target.value) || 0;
      autoSave();
    });

    c.querySelectorAll('.save-row').forEach(row => {
      row.addEventListener('click', () => {
        const ab = row.dataset.ab;
        const idx = character.saving_throw_proficiencies.indexOf(ab);
        if (idx >= 0) character.saving_throw_proficiencies.splice(idx, 1);
        else character.saving_throw_proficiencies.push(ab);
        row.classList.toggle('proficient');
        const bonus = Calc.savingThrow(character, ab);
        row.querySelector('span:last-child').textContent = (bonus >= 0 ? '+' : '') + bonus;
        autoSave();
      });
    });

    document.getElementById('add-weapon-btn')?.addEventListener('click', () => {
      const sel = document.getElementById('weapon-pick');
      const name = sel.value;
      if (!name) return;
      const all = [...DND.WEAPONS.simple_melee, ...DND.WEAPONS.simple_ranged, ...DND.WEAPONS.martial_melee, ...DND.WEAPONS.martial_ranged];
      const wpn = all.find(w => w.name === name);
      if (!wpn) return;
      const isMelee = [...DND.WEAPONS.simple_melee, ...DND.WEAPONS.martial_melee].includes(wpn);
      const abilityMod = isMelee ? Calc.modifier(character.abilities.str) : Calc.modifier(character.abilities.dex);
      const attackBonus = abilityMod + Calc.proficiencyBonus(character.identity.level);
      character.combat.attacks.push({
        name: wpn.name,
        attack_bonus: (attackBonus >= 0 ? '+' : '') + attackBonus,
        damage: wpn.damage + (abilityMod >= 0 ? '+' : '') + abilityMod,
        damage_type: wpn.type
      });
      renderAttacks();
      autoSave();
    });

    document.getElementById('add-custom-attack-btn')?.addEventListener('click', () => {
      character.combat.attacks.push({ name: 'Attacco Personalizzato', attack_bonus: '+0', damage: '1d6', damage_type: 'Custom' });
      renderAttacks();
      autoSave();
    });
  }

  function renderAttacks() {
    const tbody = document.getElementById('attacks-body');
    if (!tbody) return;
    tbody.innerHTML = '';
    character.combat.attacks.forEach((atk, i) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><input type="text" value="${atk.name}" style="background:transparent;border:none;outline:none;color:var(--text);width:100%" class="atk-name" data-i="${i}"></td>
        <td><input type="text" value="${atk.attack_bonus}" style="background:transparent;border:none;outline:none;color:var(--gold);width:60px;text-align:center" class="atk-bonus" data-i="${i}"></td>
        <td><input type="text" value="${atk.damage}" style="background:transparent;border:none;outline:none;color:var(--red2);width:70px" class="atk-dmg" data-i="${i}"></td>
        <td style="color:var(--text-dim);font-size:0.8rem">${atk.damage_type}</td>
        <td><button class="eq-item-delete atk-del" data-i="${i}">✕</button></td>
      `;
      tr.querySelectorAll('input').forEach(inp => {
        inp.addEventListener('change', () => {
          const idx = parseInt(inp.dataset.i);
          if (inp.classList.contains('atk-name')) character.combat.attacks[idx].name = inp.value;
          if (inp.classList.contains('atk-bonus')) character.combat.attacks[idx].attack_bonus = inp.value;
          if (inp.classList.contains('atk-dmg')) character.combat.attacks[idx].damage = inp.value;
          autoSave();
        });
      });
      tr.querySelector('.atk-del')?.addEventListener('click', e => {
        character.combat.attacks.splice(parseInt(e.target.dataset.i), 1);
        renderAttacks();
        autoSave();
      });
      tbody.appendChild(tr);
    });
  }
